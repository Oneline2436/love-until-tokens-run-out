/* ============================================================
 * 1. 时间工具（全部是 t 的纯函数）
 * ============================================================ */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const bez = (() => { // cubic-bezier(0.16, 1, 0.3, 1)
  const [x1, y1, x2, y2] = [0.16, 1, 0.3, 1];
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (u) => ((ax * u + bx) * u + cx) * u, sy = (u) => ((ay * u + by) * u + cy) * u;
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let u = x; for (let i = 0; i < 6; i++) { const d = (3 * ax * u + 2 * bx) * u + cx; if (Math.abs(d) < 1e-6) break; u -= (sx(u) - x) / d; } return sy(clamp(u)); };
})();
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
/** 伪随机（确定性） */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const IMG = {};
function Pic({ src, style, pos = 'center' }) {
  const [ok, setOk] = useState(IMG[src]);
  useEffect(() => {
    if (IMG[src] !== undefined) { setOk(IMG[src]); return undefined; }
    let live = true; const im = new Image();
    im.onload = () => { IMG[src] = true; if (live) setOk(true); }; im.onerror = () => { IMG[src] = false; if (live) setOk(false); };
    im.src = src; return () => { live = false; };
  }, [src]);
  if (!ok) return null;
  return <img src={src} alt="" draggable={false} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', objectPosition: pos, ...style }} />;
}
const Box = ({ x = 0, y = 0, w, h, children, style }) => <div style={{ position: 'absolute', left: x, top: y, width: w, height: h, ...style }}>{children}</div>;
const Mono = ({ children, size = 16, color = C.dim, ls = '.3em', style }) => <div style={{ fontFamily: MONO, fontSize: size, color, letterSpacing: ls, ...style }}>{children}</div>;

/** 逐字掩码上浮（克制版：字距 +0.2em → 目标值） */
function Reveal({ text, lt, size = 56, color = C.bone, font = SERIF, weight = 900, stagger = 0.03, ls = 0.1, italic, align = 'left', lh = 1.3 }) {
  const sp = lerp(ls + 0.2, ls, bez(prog(lt, 0, 1.0)));
  return (
    <div style={{ fontFamily: font, fontWeight: weight, fontSize: size, color, letterSpacing: `${sp}em`, lineHeight: lh, textAlign: align, fontStyle: italic ? 'italic' : 'normal', whiteSpace: 'pre-wrap' }}>
      {[...text].map((ch, i) => {
        if (ch === '\n') return <br key={i} />;
        const k = bez(prog(lt, i * stagger, i * stagger + 0.6));
        return <span key={i} style={{ display: 'inline-block', overflow: 'hidden', verticalAlign: 'bottom', paddingBottom: '0.1em' }}><span style={{ display: 'inline-block', transform: `translateY(${(1 - k) * 105}%)`, opacity: k }}>{ch === ' ' ? ' ' : ch}</span></span>;
      })}
    </div>
  );
}
const Fade = ({ lt, d = 0, dur = 0.6, y = 14, children, style }) => {
  const k = bez(prog(lt, d, d + dur));
  return <div style={{ opacity: k, transform: `translateY(${(1 - k) * y}px)`, ...style }}>{children}</div>;
};

/** 用游戏自己的状态机算出指定剧情时刻的状态（固定种子，结果可复现） */
function buildSnaps(lib) {
  const R = lib.gameReducer;
  let st = R(lib.initState(1, [], { seed: 20261005 }), { type: 'START', loop: 1, seed: 20261005 });
  const pol = { morning: (s) => (s.stats.hp >= 3 ? 'ship' : 'reset'), choice: () => 0 };
  const snaps = {};
  const until = (pred, max = 20000) => {
    for (let i = 0; i < max; i++) {
      const c = st.cur; if (!c || c.t === 'ending') return false; if (pred(st)) return true;
      if (['line', 'chapter', 'banner', 'ff'].includes(c.t)) st = R(st, { type: 'ADVANCE' });
      else if (c.t === 'choice') st = R(st, { type: 'CHOOSE', opt: c.options[pol.choice(c.options)] });
      else if (c.t === 'morning') st = R(st, { type: 'MORNING', kind: pol.morning(st) });
      else if (c.t === 'console') st = R(st, { type: 'CONSOLE', opt: 'self' });
    }
    return false;
  };
  until((s) => s.day === 2 && s.cur.t === 'line' && s.cur.who === 'lauren' && s.scene.bg === 'cafe' && !s.scene.cg);
  snaps.dialog = { st };
  until((s) => s.day === 7 && s.cur.t === 'morning');
  snaps.morning = { st: { ...st, flags: { ...st.flags, heat: 2 } } };
  const b = st;
  const sc = (o) => ({ ...b.scene, fx: null, cg: null, split: null, ...o });
  snaps.console = { st: { ...b, day: 8, stats: { ...b.stats, hp: 1 }, cur: { t: 'console', id: 9e6 + 1 }, scene: sc({ bg: 'server', fx: 'alarm', cast: ['tibo'], time: '14:00', loc: '地下三层 · H200 机房' }) } };
  snaps.choice = { st: { ...b, day: 8, scene: sc({ bg: 'bay', cast: ['tibo', 'lauren'], time: '19:52', loc: '海湾 · 大项目测试' }),
    cur: { t: 'choice', id: 9e6 + 2, prompt: '还有八分钟她就到了。3 号机柜在冒烟，小林在对讲机里喊：「Tibo，现在必须决定！」', sec: 12, timeout: { label: '（愣在原地）' },
      options: [{ label: '「切小模型保住全网，我去海湾。」' }, { label: '「我留下来。」——给她发：「对不起，今晚来不了。」' }, { label: '「把测试机的满血算力，只切给她一个人。」' }] } } };
  snaps.dm = { st: { ...b, day: 9, scene: sc({ bg: 'office', cast: ['tibo'], time: '23:40', loc: 'OpenAI 总部 · 深夜工位' }),
    cur: { t: 'choice', id: 9e6 + 3, style: 'dm', prompt: '23:40。手机同时亮起三条消息。',
      options: [{ from: 'lauren', label: '睡了吗。今天的提速……还挺快的。' }, { from: 'sam', label: '明天稳吗？董事会在看。' }, { from: 'team', label: '3 号机柜温度又上来了，要不要我先降频？' }] } } };
  pol.choice = (o) => { const i = o.findIndex((x) => /十二秒|击穿|并肩|两颗糖/.test(x.label)); return i >= 0 ? i : 0; };
  until((s) => s.day === 18 && s.scene.split && s.cur.t === 'line' && s.cur.who === 'lauren');
  snaps.split = { st };
  until((s) => s.day === 24 && s.cur.t === 'line');
  snaps.feed = { st, feed: true };
  snaps.archive = { st, panel: 'archive', archive: { seen: ['ntr', 'acquired', 'normal', 'true', 'indie', 'mars', 'fired'], cg: [], bgm: [], shards: [], runs: [], loop2: true, prev: null } };
  snaps.ending = { st: { ...st, day: 28, ending: 'true', stats: { love: 100, rival: 12, hp: 4, rep: 92 }, flags: { ...st.flags, belShipped: true }, cur: { t: 'ending', id: 9e6 + 4, end: 'true' }, scene: sc({ bg: 'bay', cg: 'true' }) } };
  return snaps;
}
/** 关掉 iframe 里的 CSS 动画与过渡：保证逐帧导出与实时播放一致 */
const FREEZE_CSS = '*,*::before,*::after{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}';

function useGameDeck(shots) {
  const r0 = useRef(null), r1 = useRef(null);
  const refs = [r0, r1];
  const [ready, setReady] = useState(false);
  const snaps = useRef([null, null]);
  const applied = useRef(['', '']);
  const gameShots = shots.filter((s) => s.kind === 'game');
  gameShots.forEach((s, i) => { s.slot = i % 2; });
  const need = gameShots.length > 0;
  const apply = (k, key) => {
    const w = refs[k].current?.contentWindow; const sn = snaps.current[k]?.[key];
    if (!w?.__g || !sn) return;
    if (sn.archive) w.__g.setArchive(sn.archive);
    w.__g.act({ type: 'LOAD', st: sn.st });
    w.__g.setFeedOpen(!!sn.feed);
    w.__g.setPanel(sn.panel || null);
    applied.current[k] = key;
  };
  useEffect(() => {
    if (!need) { setReady(true); return undefined; }
    let done = 0; let dead = false;
    const init = (k) => {
      const w = refs[k].current?.contentWindow;
      if (dead) return;
      if (!w || !w.__lib || !w.__g) { setTimeout(() => init(k), 150); return; }
      const css = w.document.createElement('style'); css.textContent = FREEZE_CSS; w.document.head.appendChild(css);
      snaps.current[k] = buildSnaps(w.__lib);
      // 预热：把每个状态都过一遍，让游戏内图片进缓存
      const keys = Object.keys(snaps.current[k]); let i = 0;
      const warm = () => { if (dead) return; if (i >= keys.length) { applied.current[k] = ''; if (++done === 2) setReady(true); return; } apply(k, keys[i++]); setTimeout(warm, 450); };
      warm();
    };
    init(0); init(1);
    return () => { dead = true; };
  }, []);
  /** 每个槽位显示"当前或下一个"属于它的镜头的状态 */
  const sync = (t) => {
    if (!ready) return;
    [0, 1].forEach((k) => {
      const s = gameShots.find((g) => g.slot === k && t < g.b);
      if (s && applied.current[k] !== s.game) apply(k, s.game);
    });
  };
  return { refs, ready, sync, gameShots, need };
}

/* ============================================================
 * 6. 播放器
 * ============================================================ */
const XF = 0.35;
function shotAlpha(s, t) { const xf = s.cut ? 0.04 : XF; return t < s.a - xf || t > s.b ? 0 : bez(prog(t, s.a - xf, s.a)); }

export default function Promo() {
  const comp = COMPS[COMP_ID];
  const audio = useRef(null);
  const [t, setT] = useState(0);
  const tRef = useRef(0);
  const [phase, setPhase] = useState(RENDER ? 'render' : 'ready');
  const [ui, setUi] = useState(true);
  const [muted, setMuted] = useState(false);
  const [scale, setScale] = useState(1);
  const deck = useGameDeck(comp.shots);
  const drag = useRef(false);
  const [fontsOk, setFontsOk] = useState(false);

  useEffect(() => {
    const r = () => setScale(Math.min(window.innerWidth / W, window.innerHeight / H)); r(); window.addEventListener('resize', r);
    document.fonts?.ready.then(() => setFontsOk(true));
    // 预加载所有镜头图片
    const srcs = [A('cg/end_true.jpg'), A('ui/reset_card.webp'), A('ui/reset_card_lauren.webp'), A('avatar/tibo.webp'), A('avatar/lauren.webp')];
    comp.shots.forEach((s) => [s.src, s.bg].filter(Boolean).forEach((x) => srcs.push(x)));
    srcs.forEach((src) => { if (IMG[src] === undefined) { const im = new Image(); im.onload = () => { IMG[src] = true; }; im.onerror = () => { IMG[src] = false; }; im.src = src; } });
    window.__srcs = srcs;
    return () => window.removeEventListener('resize', r);
  }, []);
  useEffect(() => { deck.sync(t); });

  // 逐帧导出接口
  useEffect(() => {
    if (!RENDER) return;
    window.__ready = () => deck.ready && fontsOk && (window.__srcs || []).every((x) => IMG[x] !== undefined);
    window.__frame = (nt) => new Promise((res) => { tRef.current = nt; setT(nt); requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(res, 20))); });
    window.__meta = { dur: comp.dur, start: comp.start, audioEnd: comp.audioEnd };
  }, [deck.ready, fontsOk]);

  // 实时播放：rAF 读取音频真实秒数
  useEffect(() => {
    if (RENDER) return undefined;
    let raf, last = 0;
    const loop = () => {
      last = performance.now();
      const a = audio.current;
      if (a && !drag.current) {
        const nt = clamp(a.currentTime - comp.start, 0, comp.dur);
        if (!a.paused) {
          const k = Math.min(prog(nt, 0, 0.25), 1 - prog(nt, comp.audioEnd - 1.3, comp.audioEnd));
          a.volume = muted ? 0 : clamp(k);
          if (nt >= comp.dur - 0.02) { a.pause(); setPhase('end'); }
        }
        tRef.current = nt; setT(nt);
      }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    const bg = setInterval(() => { if (performance.now() - last > 300) { cancelAnimationFrame(raf); loop(); } }, 250);
    return () => { cancelAnimationFrame(raf); clearInterval(bg); };
  }, [muted]);

  const play = () => { const a = audio.current; if (!a) return; if (phase === 'end' || a.currentTime - comp.start >= comp.dur - 0.05 || a.currentTime < comp.start) a.currentTime = comp.start; a.play().then(() => setPhase('play')).catch(() => setPhase('pause')); };
  const pause = () => { audio.current?.pause(); setPhase('pause'); };
  const seek = (nt) => { const a = audio.current; if (!a) return; const v = clamp(nt, 0, comp.dur - 0.05); a.currentTime = comp.start + v; tRef.current = v; setT(v); if (phase === 'end') setPhase('pause'); };
  const toggle = () => (phase === 'play' ? pause() : play());
  const full = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); };
  useEffect(() => {
    if (RENDER) return undefined;
    let tm; const show = () => { setUi(true); clearTimeout(tm); tm = setTimeout(() => setUi(false), 2200); };
    window.addEventListener('mousemove', show); return () => { window.removeEventListener('mousemove', show); clearTimeout(tm); };
  }, []);
  useEffect(() => {
    if (RENDER) return undefined;
    const h = (e) => { if (e.code === 'Space') { e.preventDefault(); phase === 'ready' ? play() : toggle(); } else if (e.key === 'ArrowRight') seek(tRef.current + 5); else if (e.key === 'ArrowLeft') seek(tRef.current - 5); else if (e.key === 'f' || e.key === 'F') full(); else if (e.key === 'm' || e.key === 'M') setMuted((m) => !m); };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  });

  const song = comp.start + t;
  const visible = comp.shots.map((s, i) => ({ s, i, o: shotAlpha(s, t) })).filter((x) => x.o > 0);
  const cur = [...comp.shots].reverse().find((s) => t >= s.a) || comp.shots[0];
  const lyric = t < comp.audioEnd - 0.4 ? LYRICS.find(([a, b]) => song >= a - 0.12 && song < b + 0.1) : null;
  const lyricO = lyric ? Math.min(prog(song, lyric[0] - 0.12, lyric[0] + 0.12), 1 - prog(song, lyric[1] - 0.1, lyric[1] + 0.1)) : 0;
  const showUi = !RENDER && (ui || phase !== 'play');
  const scrub = (e) => { const r = e.currentTarget.getBoundingClientRect(); seek(((e.clientX - r.left) / r.width) * comp.dur); };
  const fadeAll = COMP_ID === 'mv' ? 1 - prog(t, comp.dur - 1.5, comp.dur) : 1;

  return (
    <div style={{ position: 'fixed', inset: 0, background: '#000', overflow: 'hidden', cursor: showUi ? 'default' : 'none' }}>
      <style>{CSS}</style>
      {!RENDER && <audio ref={audio} src={SONG} preload="auto" />}
      {/* 1920×1080 画布，等比缩放居中 */}
      <div style={{ position: 'absolute', left: '50%', top: '50%', width: W, height: H, transform: `translate(-50%,-50%) scale(${scale})`, background: C.ink, overflow: 'hidden' }}>
        <div style={{ position: 'absolute', inset: 0, opacity: fadeAll }}>
          {visible.map(({ s, i, o }) => {
            const R = RENDERERS[s.kind]; const lt = t - s.a; const len = s.b - s.a;
            return (
              <div key={i} style={{ position: 'absolute', inset: 0, opacity: o, zIndex: 1 + i * 2 }}>
                {s.kind === 'game' ? (<><GameFrame /><Caption lt={lt} {...s.cap} /></>) : <R s={s} lt={lt} len={len} live={!RENDER} onPlay={() => { location.href = './index.html#start'; }} />}
              </div>
            );
          })}
          {/* 实机画面（两个游戏实例），层级紧贴所属镜头 */}
          {deck.need && [0, 1].map((k) => {
            const s = deck.gameShots.find((g) => g.slot === k && t >= g.a - (g.cut ? 0.04 : XF) && t <= g.b);
            const o = s ? shotAlpha(s, t) : 0;
            const z = s ? lerp(1, 1.035, smooth((t - s.a) / (s.b - s.a))) : 1;
            return (
              <div key={k} style={{ position: 'absolute', left: GAME_RECT.x, top: GAME_RECT.y, width: GAME_RECT.w, height: GAME_RECT.h, overflow: 'hidden', opacity: o, zIndex: s ? 2 + comp.shots.indexOf(s) * 2 : 0, pointerEvents: 'none', visibility: o > 0 ? 'visible' : 'hidden' }}>
                <iframe ref={deck.refs[k]} src="./index.html?promo" title={`game-${k}`} style={{ width: 1920, height: 1080, border: 0, transformOrigin: '0 0', transform: `scale(${(GAME_RECT.w / 1920) * z}) translate(${-(z - 1) * 960}px, ${-(z - 1) * 540}px)` }} />
              </div>
            );
          })}
          <Particles t={t} shot={cur} />
        </div>
        {/* 遮幅：上方段落标签，下方歌词 */}
        <div style={{ position: 'absolute', left: 0, right: 0, top: 0, height: BAR, background: '#000', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 120px' }}>
          <Mono size={15} color="rgba(236,230,218,.5)" ls=".4em">{cur.label ?? ''}</Mono>
          <Mono size={15} color="rgba(236,230,218,.35)" ls=".4em">相恋 ～ 直到 TOKENS 耗尽</Mono>
        </div>
        <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, height: BAR, background: '#000', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          {lyric && <div style={{ fontFamily: SERIF, fontWeight: 500, fontSize: 34, letterSpacing: '.14em', color: C.bone, opacity: lyricO * fadeAll, transform: `translateY(${(1 - lyricO) * 6}px)` }}>{lyric[2]}</div>}
        </div>
        <div className="pv-grain" />
        <div style={{ position: 'absolute', inset: 0, zIndex: 520, pointerEvents: 'none', background: 'radial-gradient(ellipse 80% 75% at 50% 50%, transparent 62%, rgba(0,0,0,.4))' }} />
      </div>

      {phase === 'ready' && (
        <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: 'rgba(5,5,8,.95)', zIndex: 800, color: C.bone }}>
          <Mono size={12} color={C.pink} ls=".6em">{comp.title}</Mono>
          <div style={{ fontFamily: SERIF, fontWeight: 900, fontSize: 'min(10vw,120px)', letterSpacing: '.18em', marginTop: 14 }}>相恋</div>
          <div style={{ fontFamily: SERIF, fontSize: 'min(2.6vw,30px)', letterSpacing: '.3em', color: 'rgba(236,230,218,.8)' }}>～ 直到 <span style={{ fontFamily: DISPLAY, fontStyle: 'italic', color: C.pink, letterSpacing: 0 }}>tokens</span> 耗尽 ～</div>
          <button onClick={play} disabled={!deck.ready} className="pv-btn solid" style={{ marginTop: 40, opacity: deck.ready ? 1 : 0.4 }}>{deck.ready ? '▶ 播放' : '载入实机画面…'}</button>
          <div style={{ display: 'flex', gap: 28, marginTop: 26 }}>
            <a className="pv-link" href={COMP_ID === 'mv' ? './promo.html' : './promo.html?comp=mv'}>{COMP_ID === 'mv' ? '看宣传片 · 60s' : '看主题曲 MV · 3:28'}</a>
            <a className="pv-link" href="./index.html">返回游戏标题</a>
          </div>
        </div>
      )}
      {!RENDER && phase !== 'ready' && (
        <div className="pv-bar" style={{ opacity: showUi ? 1 : 0, pointerEvents: showUi ? 'auto' : 'none' }}>
          <button onClick={toggle} className="pv-icon">{phase === 'play' ? '❚❚' : '▶'}</button>
          <Mono size={12} color="rgba(236,230,218,.75)" ls=".1em" style={{ minWidth: 104 }}>{fmt(t)} / {fmt(comp.dur)}</Mono>
          <div className="pv-track" onPointerDown={(e) => { drag.current = true; e.currentTarget.setPointerCapture(e.pointerId); scrub(e); }} onPointerMove={(e) => { if (drag.current) scrub(e); }} onPointerUp={() => { drag.current = false; }}>
            <div style={{ position: 'absolute', left: 0, top: '50%', height: 2, width: `${(t / comp.dur) * 100}%`, background: C.pink, transform: 'translateY(-50%)' }} />
            {comp.marks.map(([mt, name]) => (
              <button key={name} className="pv-act" onPointerDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); seek(mt + 0.01); }} style={{ left: `${(mt / comp.dur) * 100}%`, color: t >= mt ? C.bone : 'rgba(236,230,218,.4)' }}><span>{name}</span><i /></button>
            ))}
            <div style={{ position: 'absolute', top: '50%', left: `${(t / comp.dur) * 100}%`, width: 10, height: 10, borderRadius: 9, background: C.bone, transform: 'translate(-50%,-50%)' }} />
          </div>
          <button onClick={() => setMuted((m) => !m)} className="pv-icon">{muted ? '🔇' : '🔊'}</button>
          <button onClick={full} className="pv-icon">⛶</button>
          <a href={COMP_ID === 'mv' ? './promo.html' : './promo.html?comp=mv'} className="pv-link">{COMP_ID === 'mv' ? '宣传片' : 'MV'}</a>
          <a href="./index.html" className="pv-link">返回标题</a>
        </div>
      )}
    </div>
  );
}

/** 粒子：t 的纯函数（导出逐帧可复现）。雨夜镜头下雨，片尾升起 Token 光斑，其余是极淡的尘埃 */
function Particles({ t, shot }) {
  const ref = useRef(null);
  const mode = shot.kind === 'end' ? 'tokens' : /rain|duel|ntr|street/.test(shot.src || shot.bg || '') ? 'rain' : 'dust';
  useEffect(() => {
    const cv = ref.current; const ctx = cv.getContext('2d');
    if (cv.width !== W) { cv.width = W; cv.height = H; }
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < 160; i++) {
      const r1 = hash(i), r2 = hash(i + 99), r3 = hash(i + 7);
      if (mode === 'rain') {
        const y = ((r1 + t * (1.1 + r2 * 0.8)) % 1.2) - 0.1, x = (r3 - t * 0.04 + 2) % 1;
        ctx.strokeStyle = `rgba(200,215,235,${0.08 + r2 * 0.14})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x * W, BAR + y * AREA_H); ctx.lineTo(x * W - 4, BAR + y * AREA_H + 20 + r2 * 22); ctx.stroke();
      } else if (mode === 'tokens') {
        if (i > 90) continue;
        const y = 1 - ((r1 + t * (0.03 + r2 * 0.05)) % 1), x = r3 + Math.sin(t * 0.5 + i) * 0.01;
        ctx.fillStyle = i % 2 ? `rgba(242,166,198,${0.2 + r2 * 0.45})` : `rgba(217,180,106,${0.2 + r2 * 0.45})`;
        ctx.beginPath(); ctx.arc(x * W, BAR + y * AREA_H, 1 + r2 * 2.4, 0, 7); ctx.fill();
      } else {
        if (i > 60) continue;
        const y = 1 - ((r1 + t * 0.012) % 1);
        ctx.fillStyle = `rgba(236,230,218,${0.04 + r2 * 0.08})`; ctx.fillRect(r3 * W, BAR + y * AREA_H, 1.4, 1.4);
      }
    }
  });
  return <canvas ref={ref} style={{ position: 'absolute', inset: 0, width: W, height: H, zIndex: 400, pointerEvents: 'none', mixBlendMode: 'screen' }} />;
}

const GRAIN = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/></svg>\")";
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&family=JetBrains+Mono:wght@400;700&family=Noto+Serif+SC:wght@500;700;900&display=swap');

.pv-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#ece6da;background:rgba(5,5,8,.5);border:1px solid rgba(236,230,218,.2);cursor:pointer;font-size:12px}
.pv-track{position:relative;flex:1;height:30px;cursor:pointer;touch-action:none}
