/** 心情文字 → 表情差分 */
function expressionOf(who, mood = '') {
  const m = mood || '';
  if (who === 'lauren') {
    if (/哭|眼眶|吸鼻子/.test(m)) return 'cry';
    if (/大笑|偷笑|破涕为笑/.test(m)) return 'laugh';
    if (/翻白眼|羞愤|锤|气/.test(m)) return 'angry';
    if (/脸红|耳根|害羞|破防|捂脸|慌张|羞|心跳|爆炸|胸口/.test(m)) return 'blush';
    if (/惊|瞳孔|睁大|意外|狐疑|发亮/.test(m)) return 'surprised';
    if (/叹气|轻声|犹豫|失望|疲惫|动摇|小声/.test(m)) return 'sad';
    if (/别过|嘴硬/.test(m)) return 'tsun';
    if (/冷|抱胸|无语|识破/.test(m)) return 'cold';
    if (/笑|上扬|夸|傲娇|靠|挽/.test(m)) return 'smile';
    return 'default';
  }
  if (who === 'tibo') {
    if (/封条/.test(m)) return 'gag';
    if (/鼻血/.test(m)) return 'nosebleed';
    if (/惊醒|震惊|大变|变/.test(m)) return 'shock';
    if (/瘫|抖|抱头|苦笑|心虚|慢半拍/.test(m)) return 'tired';
    if (/燃|握拳|认真|咬牙|打电话|跑/.test(m)) return 'fire';
    if (/拥抱|湿润|握住|温柔/.test(m)) return 'gentle';
    if (/笑/.test(m)) return 'smile';
    return 'default';
  }
  if (who === 'dario') {
    if (/淋|落汤/.test(m)) return 'wet';
    if (/僵|铁青/.test(m)) return 'shock';
    if (/举杯|红酒|酒杯/.test(m)) return 'toast';
    if (/无视|看都没看|计划|关上|冷|关窗/.test(m)) return 'cold';
    return 'default';
  }
  if (who === 'sam') return /叹气|严肃/.test(m) ? 'worried' : 'default';
  return 'default';
}

/* ============================================================
 * 5. 状态机

/**
 * extra：跨周目带进来的东西
 *  - shards：归档里此前所有周目收集到的记忆碎片（只读，用于 countShards）
 *  - prev：上一周目的结局摘要 { end, day, day18Won }，二周目台词据此分支（Tibo 只记得自己见过的事）
 *  - seed：随机数种子。剧情里的随机（网友昵称、吐槽文案）全部由它推导，读档重放才能逐字还原
 */
function initState(loop = 1, seen = [], extra = {}) {
  const seed = extra.seed ?? ((Math.random() * 2 ** 31) | 0);
  return {
    phase: 'title', loop, seen, day: loop === 1 ? 0 : 1, chapter: 0,
    stats: loop === 1 ? { love: 20, rival: 12, hp: 6, rep: 34 } : { love: 22, rival: 8, hp: 10, rep: 40 },
    flags: {}, card: 'none', feed: [], queue: [], cur: null, journal: [],
    scene: { bg: 'rain', cast: [], split: null, fx: null, cg: null, bgm: null, time: '', loc: '' },
    floaters: [], particles: [], shake: 0, ending: null, failing: false, rewinding: false,
    shards: extra.shards || [], prev: extra.prev || null, seed, rng: seed, trail: [],
  };
}

/** mulberry32：随机状态存在 st.rng 里（会被就地推进，调用方须持有 st 的副本） */
function rnd(st) {
  let t = (st.rng = (st.rng + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rpick = (st, arr) => arr[Math.floor(rnd(st) * arr.length)];

function mkTweet(b, st) {
  return { id: uid(), who: b.who, text: b.text, day: st.day, poll: b.poll, votes: b.votes, img: b.img, name: b.who === 'net' ? rpick(st, NET_NAMES) : null, av: Math.floor(rnd(st) * 6), likes: Math.floor(rnd(st) * 9000) + 120, rts: Math.floor(rnd(st) * 2000) + 20 };
}

function applyEff(st, e) {
  if (!e || !Object.keys(e).length) return st;
  const s = { ...st.stats };
  const fl = [];
  const delta = (k, nv) => { const d = nv - s[k]; s[k] = nv; if (d) fl.push({ id: uid(), key: k, d }); };
  STATS.forEach((k) => {
    let v = e[k];
    if (!v) return;
    if (k === 'love' && v > 0 && st.loop === 2) v = Math.round(v * 1.25);
    delta(k, clamp(s[k] + v, 0, MAX[k]));
  });
  if (e.set) Object.entries(e.set).forEach(([k, v]) => delta(k, clamp(v, 0, MAX[k])));
  if (e.min) Object.entries(e.min).forEach(([k, v]) => { if (s[k] < v) delta(k, v); });
  let particles = st.particles;
  let shake = st.shake;
  fl.forEach((f) => {
    if (f.key === 'love' && f.d > 0) particles = [...particles, ...Array.from({ length: Math.min(14, 4 + f.d / 2) }, () => ({ id: uid(), kind: 'heart', x: 15 + Math.random() * 70, r: Math.random() * 60 - 30, delay: Math.random() * 0.5 }))];
    if ((f.key === 'love' && f.d < 0) || (f.key === 'rival' && f.d >= 10)) {
      shake += 1;
      particles = [...particles, ...Array.from({ length: 6 }, () => ({ id: uid(), kind: f.key === 'rival' ? 'wine' : 'crack', x: 20 + Math.random() * 60, r: Math.random() * 60 - 30, delay: Math.random() * 0.4 }))];
    }
    if (f.key === 'hp' && f.d < 0) shake += 0;
  });
  return { ...st, stats: s, floaters: [...st.floaters, ...fl], particles, shake };
}

function pump(input) {
  let st = { ...input };
  let q = [...st.queue];
  let guard = 0;
  while (guard++ < 800) {
    if (!st.failing && (st.stats.rival >= 100 || st.stats.rep <= 0)) {
      q = st.stats.rival >= 100 ? earlyNtr(st.day) : firedBeats(st.day);
      st.failing = true;
    }
    if (!q.length) { st.cur = null; break; }
    let b = q.shift();
    if (typeof b === 'function') { q = [...[].concat(b(st) || []).filter(Boolean), ...q]; continue; }
    b = { ...b, id: uid() };
    switch (b.t) {
      case 'tweet': st.feed = [mkTweet(b, st), ...st.feed].slice(0, 80); if (b.e) st = applyEff(st, b.e); continue;
      case 'scene': {
        const { t, id, ...rest } = b;
        // 换背景 = 换场：上一场的 CG 与指定配乐自动退场（除非这一句同时指定了新的）
        const reset = rest.bg !== undefined ? { cg: null, bgm: null } : {};
        st.scene = { ...st.scene, ...reset, ...rest };
        continue;
      }
      case 'lateReset': {
        const key = `m${st.day}`;
        if (st.flags[key] === 'reset') continue;
        const hist = HISTORY[st.day];
        st.flags = { ...st.flags, [key]: 'reset', ships: Math.max(0, (st.flags.ships || 0) - (st.flags[key] ? 1 : 0)), resets: (st.flags.resets || 0) + 1 };
        st.journal = (st.journal || []).map((j) => (j.day === st.day && j.kind ? { ...j, kind: 'reset', text: `${j.text} → 当天又宣布了 Reset`, match: hist ? hist.kind === 'reset' : null } : j));
        continue;
      }
      case 'eff': st = applyEff(st, b.e); continue;
      case 'flag': st.flags = { ...st.flags, ...b.f }; continue;
      case 'day': st.day = b.d; continue;
      case 'card': st.card = b.v; continue;
      case 'lock': st.failing = true; continue;
      case 'log': st.journal = [...(st.journal || []), { id: b.id, day: b.day ?? st.day, text: b.text, real: b.real }]; continue;
      case 'chapter': st.chapter = b.n; st.chapterTitle = b.title; break;
      case 'choice': {
        const opts = b.options.filter((o) => !o.req || o.req(st));
        if (!b.fixed) for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(rnd(st) * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
        b = { ...b, options: opts };
        break;
      }
      case 'ff': st.day = b.to; break;
      case 'ending':
        st.ending = b.end;
        if (st.loop === 1 && ENDINGS[b.end]?.tone !== 'good') st.card = 'armed';
        if (!st.seen.includes(b.end)) st.seen = [...st.seen, b.end];
        break;
      default: break;
    }
    if (b.e) st = applyEff(st, b.e);
    st.cur = b;
    break;
  }
  st.queue = q;
  return st;
}

function reducer(st, a) {
  switch (a.type) {
    case 'START': {
      const loop = a.loop || 1;
      const extra = {
        seed: a.seed,
        shards: a.shards ?? st.shards,
        prev: loop === 2 ? (a.prev ?? st.prev) : null,
      };
      const s = { ...initState(loop, a.seen ?? st.seen, extra), phase: 'play', queue: buildStory(loop === 2) };
      if (loop === 2) s.feed = [mkTweet({ who: 'sys', text: '⏪ 时间线已重置。欢迎回到 Day 1。' }, s)];
      return pump(s);
    }
    case 'ADVANCE': {
      if (!st.cur || !['line', 'chapter', 'banner', 'ff'].includes(st.cur.t)) return st;
      return pump({ ...st, cur: null });
    }
    case 'CHOOSE': {
      if (a.opt.real && a.opt.tag) st = { ...st, toast: { id: uid(), text: a.opt.tag.replace(/^📜\s*/, '📜 彩蛋 · ') } };
      if (st.cur?.t !== 'choice') return st;
      if (!st.cur.options.includes(a.opt) && a.opt !== st.cur.timeout) return st;
      const s = applyEff(st, a.opt.e || {});
      return pump({ ...s, cur: null, queue: [...(a.opt.next || []), ...s.queue] });
    }
    case 'MORNING': {
      const b = st.cur;
      if (b?.t !== 'morning') return st;
      const day = st.day;
      const isReset = a.kind === 'reset';
      const chosen = a.kind === 'custom' && b.custom ? b.custom : b.ship;
      let s = {
        ...st,
        cur: null,
        flags: {
          ...st.flags,
          [`m${day}`]: a.kind,
          ...(chosen && !isReset && chosen.flag ? chosen.flag : {}),
          ships: (st.flags.ships || 0) + (isReset ? 0 : 1),
          resets: (st.flags.resets || 0) + (isReset ? 1 : 0),
        },
      };
      const pre = [];
      const hist = HISTORY[day];
      s.journal = [...(s.journal || []), { id: uid(), day, kind: a.kind, text: isReset ? `Day ${day} / It's a reset.` : chosen.name, match: hist ? (hist.kind === 'reset') === isReset : null }];
      // 热搜
      const heat0 = st.flags.heat || 0;
      const dHeat = isReset ? HEAT_RULE.reset : a.kind === 'custom' ? (chosen.heat ?? HEAT_RULE.custom) : (chosen.heat ?? HEAT_RULE.ship);
      const heat = clamp(heat0 + dHeat, 0, HEAT_RULE.max);
      const tired = !!st.flags.tired;
      s.flags = { ...s.flags, heat, tired: false };
      if (!isReset && chosen) {
        const cost = Math.max(1, chosen.cost - (st.loop === 2 ? 1 : 0)) + (tired ? SELF_SHIFT.nextMorningCost : 0);
        const backlash = a.kind === 'custom' && dHeat > 0 && heat >= HEAT_RULE.backlashAt;
        const warn = a.kind === 'custom' && dHeat > 0 && !backlash && heat >= HEAT_RULE.warnAt && heat0 < HEAT_RULE.warnAt;
        s = applyEff(s, backlash ? { hp: -cost, ...HEAT_RULE.backlashEff } : { hp: -cost, love: chosen.love, rep: chosen.rep, rival: chosen.rival || 0 });
        if (warn) s = applyEff(s, HEAT_RULE.warnEff);
        if (tired) pre.push(SYS('昨天在机房顶了一整个下午，今天的发布多花了 1 格体力。'));
        pre.push(TW('tibo', chosen.tweet), TW('net', rpick(s, PRAISE)));
        if (chosen.laurenTweet && !backlash) pre.push(TW('lauren', chosen.laurenTweet));
        if (warn) pre.push(HEAT_EVENTS.warn);
        if (backlash) pre.push(HEAT_EVENTS.backlash);
        // 私货事故：risk: { chance, text, e }（按种子掷骰，读档可复现）
        if (chosen.risk && rnd(s) < chosen.risk.chance) { s = applyEff(s, chosen.risk.e || {}); pre.push(TW('net', chosen.risk.text)); }
        const needHp = s.flags.pstackAllied ? 1 : 2;
        if (s.stats.hp < needHp && !b.noConsole) pre.push(SC({ bg: 'server', fx: 'alarm', cast: ['tibo'], time: '14:00', loc: '地下三层 · 机房' }), SYS(`⚠ 14:00 · 机房冒烟了！服务器体力只剩 ${s.stats.hp} 格，撑不到 20:00 的约会（需要 ${needHp} 格）！`), { t: 'console' }, SC({ fx: null }));
      } else {
        const lazy = st.flags[`m${day - 1}`] === 'reset';
        s = applyEff(s, lazy ? RESET_EFF.lazy : RESET_EFF.normal);
        pre.push(TW('tibo', `Day ${day} / It's a reset.`), TW('net', lazy ? rpick(s, MOCK) : rpick(s, RESET_CHEER)), TW('thariq', rpick(s, THARIQ_MOCK)));
      }
      if (a.auto) s = { ...s, toast: { id: uid(), text: `⏩ Day ${day} · 托管发布 · ${isReset ? "It's a reset" : 'Ship'} · 体力 ${st.stats.hp}→${s.stats.hp}` } };
      return pump({ ...s, queue: [...pre, ...s.queue] });
    }
    case 'CONSOLE': {
      if (st.cur?.t !== 'console') return st;
      const { opt, vip } = a;
      let s = { ...st, cur: null };
      const pre = [];
      if (opt === 'dumb') {
        s = applyEff(s, { hp: vip ? 2 : 4, rep: vip ? -4 : -8 });
        pre.push(SYS(vip ? '后台已切换：全网 → 小模型（人工智障版）｜@poteto → 满血 VIP 独享专线 🔒' : '后台已切换：全网 → 小模型（人工智障版）'), TW('net', '今天的模型怎么像喝了假酒？我问它 1+1，它说「取决于你的心情」'));
      } else if (opt === 'slow') {
        s = applyEff(s, { hp: 2, rep: -6 });
        pre.push(SYS('网速已掐慢 ×10｜屏幕提示：「正在为您深度思考人生……」'), TW('net', '它「深度思考人生」思考了 4 分钟，然后回答我：「嗯。」'));
      } else if (opt === 'blame') {
        s = applyEff(s, { hp: 2, rep: -15 });
        pre.push(TW('tibo', '【公告】因隔壁施工挖断光缆，部分服务暂时中断，敬请谅解🙏'), TW('net', '隔壁？你们隔壁是旧金山湾吧？？'));
      } else if (opt === 'self') {
        s = applyEff(s, SELF_SHIFT.eff);
        pre.push(SYS('你脱下外套，钻进 3 号机柜后面，和值班的小林一起把冷却泵拆了又装。'), TW('net', '有人在 OpenAI 机房看到 Tibo 本人在拧螺丝？？'));
      } else {
        s = applyEff(s, { rep: 3 });
        pre.push(SYS('你没有暗改。光明磊落——但今晚，体力一定撑不到约会了。'));
      }
      s.flags = { ...s.flags, tamper: opt, vip: opt === 'dumb' && !!vip, ...(opt === 'self' ? { tired: true } : {}) };
      return pump({ ...s, queue: [...pre, ...s.queue] });
    }
    case 'USE_CARD': return st.card === 'armed' ? { ...st, card: 'used', rewinding: true } : st;
    case 'NEW_LOOP': {
      const shards = [...new Set([...(a.shards || []), ...shardsOf(st)])];
      return reducer({ ...st, rewinding: false }, { type: 'START', loop: 2, prev: prevOf(st), shards, seen: a.seen });
    }
    case 'CLEAN': {
      const ids = new Set(a.ids);
      return { ...st, floaters: st.floaters.filter((f) => !ids.has(f.id)), particles: st.particles.filter((p) => !ids.has(p.id)) };
    }
    case 'TITLE': return initState(1, a.seen ?? st.seen, { shards: a.shards ?? st.shards });
    case 'LOAD': return { ...a.st, phase: 'play', rewinding: false };
    default: return st;
  }
}

/** 这一局拿到的碎片（含归档带进来的） */
const shardsOf = (st) => [...new Set([...(st.shards || []), ...Object.keys(SHARD_META).filter((k) => st.flags[k])])];
/** 上一周目摘要：二周目只读这几项 */
const prevOf = (st) => ({ end: st.ending, day: st.day, day18Won: !!st.flags.day18Won });

/**
 * 存档的核心：只记录玩家的"输入"（推进 / 抉择序号 / 早间草稿 / 控制台方案），
 * 读档时从同一个种子重新开局并逐条重放，状态（包括剧本里的函数节拍）就能被完整还原。
 * trail 里连续的推进压成数字：[12, ['m','ship'], 3, ['c',1], ...]
 */
function gameReducer(st, a) {
  const ns = reducer(st, a);
  if (ns === st) return ns;
  const push = (x) => {
    const t = ns.trail || [];
    if (x === 1 && typeof t[t.length - 1] === 'number') return [...t.slice(0, -1), t[t.length - 1] + 1];
    return [...t, x];
  };
  switch (a.type) {
    case 'START':
    case 'NEW_LOOP':
      return { ...ns, start: { loop: ns.loop, seed: ns.seed, prev: ns.prev, shards: ns.shards }, trail: [] };
    case 'ADVANCE': return { ...ns, trail: push(1) };
    case 'CHOOSE': return st.cur?.t === 'choice' ? { ...ns, trail: push(['c', a.opt === st.cur.timeout ? -1 : st.cur.options.indexOf(a.opt)]) } : ns;
    case 'MORNING': return { ...ns, trail: push(['m', a.kind]) };
    case 'CONSOLE': return { ...ns, trail: push(['k', a.opt, a.vip ? 1 : 0]) };
    default: return ns;
  }
}

/** 从存档重放出完整状态；返回 { st, ok }，ok=false 表示剧本版本变了、重放结果与存档时不一致 */
function replaySave(save, seen) {
  let st = gameReducer(initState(save.start.loop, seen), { type: 'START', ...save.start, seen });
  for (const t of save.trail) {
    if (typeof t === 'number') { for (let i = 0; i < t; i++) st = gameReducer(st, { type: 'ADVANCE' }); continue; }
    const [k, x, y] = t;
    if (k === 'c') { const opt = x === -1 ? st.cur?.timeout : st.cur?.options?.[x]; if (!opt) return { st, ok: false }; st = gameReducer(st, { type: 'CHOOSE', opt }); }
    else if (k === 'm') st = gameReducer(st, { type: 'MORNING', kind: x });
    else if (k === 'k') st = gameReducer(st, { type: 'CONSOLE', opt: x, vip: !!y });
  }
  const m = save.meta || {};
  const ok = st.day === m.day && st.loop === m.loop && STATS.every((k) => st.stats[k] === m.stats?.[k]) && st.cur?.t === m.beat;
  return { st: { ...st, floaters: [], particles: [], toast: null }, ok };
}

const IMG_STATE = {};
function useImgOk(src) {
  const [ok, setOk] = useState(src ? IMG_STATE[src] : false);
  useEffect(() => {
    if (!src) { setOk(false); return undefined; }
    if (IMG_STATE[src] !== undefined) { setOk(IMG_STATE[src]); return undefined; }
    let alive = true;
    const im = new Image();
    im.onload = () => { IMG_STATE[src] = true; if (alive) setOk(true); };
    im.onerror = () => { IMG_STATE[src] = false; if (alive) setOk(false); };
    im.src = src;
    return () => { alive = false; };
  }, [src]);
  return ok;
}
function Img({ src, className = '', alt = '', style }) {

function useKeys(map, deps = []) {
  const ref = useRef(map); ref.current = map;
  useEffect(() => {
    const h = (e) => { const fn = ref.current[e.key] || ref.current[e.code]; if (fn) { e.preventDefault(); fn(e); } };
    window.addEventListener('keydown', h);

  }, deps);
}

function useNarrow() {
  const [n, setN] = useState(typeof window !== 'undefined' && window.innerWidth < 700);
  useEffect(() => { const h = () => setN(window.innerWidth < 700); window.addEventListener('resize', h); return () => window.removeEventListener('resize', h); }, []);
  return n;
}

function useCounter(target, ms, key) {
  const [n, setN] = useState(0);
  useEffect(() => {
    const t0 = performance.now(); let raf;
    const f = (t) => { const p = Math.min(1, (t - t0) / ms); setN(Math.floor(target * (1 - Math.pow(1 - p, 3)))); if (p < 1) raf = requestAnimationFrame(f); };
    raf = requestAnimationFrame(f);
    return () => cancelAnimationFrame(raf);
  }, [target, ms, key]);
  return n;
}

/** 限时抉择的倒计时：菜单打开时暂停 */
function useCountdown(sec, paused, onEnd, key) {
  const [left, setLeft] = useState(sec || 0);
  const ref = useRef({ left: sec || 0, end: onEnd }); ref.current.end = onEnd;
  useEffect(() => { ref.current.left = sec || 0; setLeft(sec || 0); }, [key]);
  useEffect(() => {
    if (!sec || paused) return undefined;
    let last = performance.now();
    const id = setInterval(() => {
      const now = performance.now(); ref.current.left = Math.max(0, ref.current.left - (now - last) / 1000); last = now;
      setLeft(ref.current.left);
      if (ref.current.left <= 0) { clearInterval(id); ref.current.end(); }
    }, 50);
    return () => clearInterval(id);
  }, [sec, paused, key]);
  return left;
}

  );

function Stage({ st, dispatch, auto, setAuto, onFeed, unread, divergence, onPanel, paused, autoQuiet }) {
  const { scene, cur, stats } = st;
  const quiet = autoQuiet && !PROMO && isQuietMorning(st, cur);
  useEffect(() => {
    if (!quiet || paused) return undefined;
    const t = setTimeout(() => dispatch({ type: 'MORNING', kind: autoMorning(st, cur), auto: true }), 350);
    return () => clearTimeout(t);
  }, [quiet, paused, cur?.id]);
  const [shaking, setShaking] = useState(false);
  const clickRef = useRef(null);
  useEffect(() => { if (!st.shake) return undefined; setShaking(true); const t = setTimeout(() => setShaking(false), 500); return () => clearTimeout(t); }, [st.shake]);
  const next = () => dispatch({ type: 'ADVANCE' });
  const speaking = cur?.t === 'line' && CHARS[cur.who] ? cur.who : null;
  const cgSrc = !scene.split && scene.cg ? ASSETS.cg[scene.cg] : null;
  const cgOk = useImgOk(cgSrc) === true;
  const need = st.flags.pstackAllied ? 1 : 2;
  const fx = scene.split && scene.fx === 'goldcode' ? null : scene.fx;
  return (
    <div className="absolute inset-0 overflow-hidden" style={{ background: '#050508' }}>
      <div className={`absolute inset-0 z-0 ${shaking ? 'anim-shake' : ''}`} style={{ filter: /另一条世界线/.test(scene.loc || '') ? 'grayscale(.85) sepia(.22) contrast(.92) brightness(.9)' : 'none', transition: 'filter 1.2s ease' }}>
        {scene.split ? <SplitStage split={scene.split} cur={cur} fx={scene.fx} /> : (
          <>
            <Backdrop bg={scene.bg} drift />
            <Cast cast={scene.cast} speaking={speaking} cur={cur} hidden={cgOk} />
          </>
        )}
        <FxLayer fx={fx} cg={scene.split ? null : scene.cg} cgOk={cgOk} />
        <div className="absolute inset-0 z-[4] pointer-events-none" style={{ background: `radial-gradient(ellipse 45% 75% at 0% 55%, rgba(242,166,198,${(stats.love / 100) * 0.22}), transparent 70%), radial-gradient(ellipse 50% 85% at 100% 50%, rgba(120,84,24,${(stats.rival / 100) * 0.42}), rgba(0,0,0,${(stats.rival / 100) * 0.25}) 40%, transparent 72%)`, transition: 'background 1.2s' }} />
        {stats.hp < need && <div className="absolute inset-0 z-[5] pointer-events-none anim-alarm" style={{ boxShadow: 'inset 0 0 120px 10px rgba(255,40,30,.45)' }} />}
        <div className="absolute inset-0 z-[6] pointer-events-none grain" />
        <div className="absolute inset-x-0 top-0 h-[28%] z-[6] pointer-events-none" style={{ background: 'linear-gradient(to bottom, rgba(5,5,8,.85), transparent)' }} />
        <div className="absolute inset-x-0 bottom-0 h-[48%] z-[6] pointer-events-none" style={{ background: 'linear-gradient(to top, rgba(5,5,8,.97) 0%, rgba(5,5,8,.84) 36%, rgba(5,5,8,0) 100%)' }} />
      </div>

      {cur?.t === 'line' && <div className="absolute inset-0 z-[20] cursor-pointer" onClick={() => clickRef.current && clickRef.current()} />}

      <HUD st={st} onFeed={onFeed} unread={unread} divergence={divergence} onMenu={() => onPanel('menu')} />
      <EdgeMeter side="L" value={stats.love} mark={80} color="#f2a6c6" label="她的心动" sub="BOND · 80" floaters={st.floaters} k="love" />
      <EdgeMeter side="R" value={stats.rival} mark={85} color="#d8b46a" label="S-1 挖角" sub="ANT · 85" floaters={st.floaters} k="rival" />
      <Particles items={st.particles} />
      <Toast toast={st.toast} />
      <TweetPush tw={st.feed[0]} onOpen={onFeed} low={!!scene.split} />

      <div className="absolute inset-x-0 bottom-0 z-40">
        {cur?.t === 'line' && <Dialogue line={cur} onNext={next} auto={auto} setAuto={setAuto} clickRef={clickRef} onPanel={onPanel} />}
      </div>
      {cur?.t === 'choice' && <ChoicePanel key={cur.id} beat={cur} loop={st.loop} paused={paused} onPick={(opt) => dispatch({ type: 'CHOOSE', opt })} />}
      {cur?.t === 'chapter' && <ChapterSplash beat={cur} onNext={next} />}
      {cur?.t === 'banner' && <BannerPanel beat={cur} onNext={next} />}
      {cur?.t === 'ff' && <FastForwardPanel beat={cur} onNext={next} />}
      {cur?.t === 'morning' && !quiet && <MorningPanel key={cur.id} beat={cur} st={st} onPick={(kind) => dispatch({ type: 'MORNING', kind })} />}
      {cur?.t === 'console' && <ConsolePanel key={cur.id} beat={cur} st={st} onPick={(opt, vip) => dispatch({ type: 'CONSOLE', opt, vip })} />}
    </div>
  );
}

/* ============================================================

 *     - 大部分对话不放音乐；只在标题、章节卡、名场面 CG、约会、危机、高潮、结局给一段
 *     - 绝大多数片段只放一遍，放完淡出回到安静，等下一次"音乐点"
 *     - 片段选自逐秒响度分析（.claude/audio_analysis/quiet_map.txt）：
 *       喜剧曲只取无鼓的前奏，《雨》只取没有重低音的段落，《阳》负责白天与高潮

  ],
  sfx: { rewind: { file: 'sfx_rewind.m4a', gain: 0.6 } },
};
const BGM_XFADE = 1.6;
/** 一次性片段在终点前多少秒开始淡出（避免硬切在乐句中间） */
const BGM_TAIL = 3.5;

const BGM = (() => {
  const S = { data: BGM_DEFAULT, vol: 0.5, muted: false, unlocked: false, want: null, cur: null, listeners: new Set() };
  const cueOf = (id) => S.data.cues.find((c) => c.id === id);
  const level = (cue) => (S.muted ? 0 : S.vol * (cue?.gain ?? 1));
  const fade = (el, to, ms, then) => {
    clearInterval(el._fade);
    const from = el.volume; const t0 = performance.now();
    el._fade = setInterval(() => {
      const p = Math.min(1, (performance.now() - t0) / ms);
      el.volume = clamp(from + (to - from) * p, 0, 1);
      if (p >= 1) { clearInterval(el._fade); then && then(); }
    }, 40);
  };
  const voice = (cue) => {
    const el = new Audio(BGM_BASE + S.data.sources[cue.src].file);
    el.preload = 'auto'; el.volume = 0;
    const go = () => { try { el.currentTime = cue.start; } catch (e) { /* 元数据未就绪 */ } el.play().catch(() => {}); };
    if (el.readyState >= 1) go(); else el.addEventListener('loadedmetadata', go, { once: true });
    return el;
  };
  const stopCur = (ms = BGM_XFADE * 1000) => { const c = S.cur; if (c) fade(c.el, 0, ms, () => c.el.pause()); S.cur = null; };
  const start = (id) => {
    stopCur();
    const cue = cueOf(id);
    if (!cue || !S.unlocked) return;
    const el = voice(cue);
    fade(el, level(cue), BGM_XFADE * 1000);
    S.cur = { id, cue, el };
    S.listeners.forEach((f) => f(id));
  };
  setInterval(() => {
    const c = S.cur;
    if (!c || c.leaving || c.el.readyState < 1) return;
    const t = c.el.currentTime;
    if (t < c.cue.end - (c.cue.loop ? BGM_XFADE : BGM_TAIL) && !c.el.ended) return;
    c.leaving = true;
    if (c.cue.loop) {
      // 循环：在终点前开一个新声部从起点淡入，旧声部同时淡出，接缝落在交叉里
      fade(c.el, 0, BGM_XFADE * 1000, () => c.el.pause());
      const el = voice(c.cue);
      fade(el, level(c.cue), BGM_XFADE * 1000);
      S.cur = { id: c.id, cue: c.cue, el };
    } else {
      // 一次性：慢慢淡出，回到安静；want 不变，所以同一场景里不会再响
      stopCur(BGM_TAIL * 1000);
    }
  }, 120);
  return {
    load(json) { if (json?.version === BGM_DEFAULT.version && json?.cues?.length && json?.sources) S.data = { ...BGM_DEFAULT, ...json, sfx: { ...BGM_DEFAULT.sfx, ...(json.sfx || {}) } }; },
    /** 设定"此刻应该在放什么"；相同则不打断；null = 安静 */
    play(id) { if (id === S.want) return; S.want = id; if (!id) { stopCur(2600); return; } start(id); },
    /** 鉴赏室：无条件从头播放 */
    audition(id) { S.want = id; start(id); },
    unlock() { if (S.unlocked) return; S.unlocked = true; if (S.want) start(S.want); },
    get unlocked() { return S.unlocked; },
    setVolume(v, muted) {
      S.vol = clamp(v, 0, 1); S.muted = !!muted;
      if (S.cur) { clearInterval(S.cur.el._fade); S.cur.el.volume = level(S.cur.cue); }
    },
    sfx(name) {
      const s = S.data.sfx?.[name]; if (!s || !S.unlocked || S.muted) return;
      const el = new Audio(BGM_BASE + s.file); el.volume = clamp(S.vol * (s.gain ?? 1), 0, 1); el.play().catch(() => {});
    },
    cues() { return S.data.cues; },
    title(id) { const c = cueOf(id); return c ? `${c.name} · ${S.data.sources[c.src]?.title || ''}` : ''; },
    onPlay(f) { S.listeners.add(f); return () => S.listeners.delete(f); },
  };
})();

/**
 * 场景 → 配乐。返回 null 表示安静（这是默认）。剧本可用 SC({ bgm }) 指定，换背景时自动清除。
 * 只有下面这些"音乐点"会出声：标题 / 章节卡 / 早间审判 / 机房控制台 / 名场面 CG / 幕间 / 额度耗尽 / 夜间约会 / Dario 登场 / 高潮 / 结局
 */
const CG_CUE = { bel: 'comeback', duel: 'comedy_bright', blackcard: 'dario', memory: 'night', vip: 'night', latte: 'latte', goldcode: 'dario', goldcode2: 'comedy_wry_full', terra: 'comeback', pixelpotato: 'comedy_bright_full', web: 'sun_mid', s1offer: 'dario', ntr: 'sad', true: 'true_end', hidden: 'hidden_end', indie: 'true_end', mars: 'comeback', acquired: 'comedy_wry', normal: 'night' };
const NIGHT_BG = new Set(['bay', 'seawall', 'rooftop', 'ramen']);
/** 早间审判只在章节首日与重头日给音乐，其余早上留白 */
const MORNING_MUSIC_DAYS = new Set([1, 3, 7, 11, 14, 17, 22, 23, 24, 28]);
function cueFor(st) {
  if (st.phase === 'title') return 'title';
  if (st.rewinding) return null;
  const c = st.cur; const sc = st.scene || {};
  if (c?.t === 'ending') return 'theme_full';
  if (c?.t === 'chapter') return 'chapter';
  if (c?.t === 'morning') return MORNING_MUSIC_DAYS.has(st.day) ? 'morning' : null;
  if (c?.t === 'console') return 'overheat';
  if (sc.bgm) return sc.bgm;
  if (/另一条世界线/.test(sc.loc || '')) return 'world_line';
  if (sc.fx === 'quota') return 'sad';
  if (!sc.split && sc.cg && CG_CUE[sc.cg]) return CG_CUE[sc.cg];
  if (sc.split) {
    if (sc.fx === 'goldcode') return sc.split.right?.who?.includes('tibo') ? 'comeback' : 'dario';
    if (sc.split.left?.mood === '封条') return 'sad';
    return sc.split.right?.warm || sc.split.left?.warm ? (st.day >= 17 ? 'night_b' : 'night') : null;
  }
  if (sc.fx === 'terra' || sc.fx === 'infinite') return 'comeback';
  if (sc.fx === 'web') return 'sun_mid';
  if (sc.fx === 'maybach' || (sc.cast || []).includes('dario')) return 'dario';
  if (NIGHT_BG.has(sc.bg) && /^(19|2[0-3]):/.test(sc.time || '')) return st.day >= 17 ? 'night_b' : 'night';
  if (sc.bg === 'call' && (sc.cast || []).includes('lauren')) return 'tender';
  // 两首喜剧曲（用户确认）：白天的整活场面与修罗场高潮
  if (sc.bg === 'stream') return 'comedy_bright_full';
  if (sc.bg === 'hackathon' || (sc.bg === 'cafe' && /^1[0-7]:/.test(sc.time || '') && (sc.cast || []).includes('lauren'))) return 'comedy_bright';
  return null;
}

            })}
            <div className="col-span-full f-mono text-[11px]" style={{ color: 'rgba(236,230,218,.45)' }}>已回收 {GALLERY_CG.filter(cgUnlocked).length} / {GALLERY_CG.length}</div>
          </div>
        )}

        {tab === 'bgm' && (
          <div className="mt-6">
            {BGM.cues().map((c, i) => {
              const ok = archive.bgm.includes(c.id);
              const on = playing === c.id;
              return (
                <button key={c.id} disabled={!ok} onClick={() => { if (on) { BGM.play(null); setPlaying(null); } else { BGM.unlock(); BGM.audition(c.id); setPlaying(c.id); } }}
                  className="w-full flex items-baseline gap-4 py-3 text-left transition hover:bg-white/[.03] disabled:cursor-not-allowed" style={{ borderTop: '1px solid rgba(236,230,218,.08)' }}>
                  <span className="f-display italic text-xl w-8 shrink-0" style={{ color: on ? '#f2a6c6' : 'rgba(236,230,218,.35)' }}>{pad2(i + 1)}</span>
                  <span className="flex-1 min-w-0">
                    <span className="block f-serif text-[15px]" style={{ color: ok ? BONE : 'rgba(236,230,218,.25)' }}>{ok ? c.name : '？？？'}</span>
                    {ok && <span className="block f-mono text-[10px] mt-0.5" style={{ color: 'rgba(236,230,218,.4)' }}>{BGM.title(c.id).split(' · ')[1]} · {Math.floor(c.start / 60)}:{pad2(Math.floor(c.start % 60))}–{Math.floor(c.end / 60)}:{pad2(Math.floor(c.end % 60))}{c.loop ? ' · 循环' : ''}</span>}
                  </span>
                  <span className="f-mono text-[10px] tracking-[.3em]" style={{ color: on ? '#f2a6c6' : 'rgba(236,230,218,.4)' }}>{ok ? (on ? '■ 停止' : '▶ 播放') : '未听过'}</span>
                </button>
              );
            })}
          </div>
        )}

        {tab === 'shard' && (
          <div className="mt-6">
            <div className="f-serif text-[13px] mb-4 leading-relaxed" style={{ color: 'rgba(236,230,218,.6)' }}>每一枚碎片，都是某一条世界线里你真实做过的事。碎片跨越轮回保留——据说攒够 {HIDDEN_SHARDS} 枚的人，能在二周目的尽头看见她口袋里的东西。</div>
            {Object.entries(SHARD_META).map(([k, d], i) => {
              const ok = shards.includes(k);
              return (
                <div key={k} className="flex items-baseline gap-4 py-2.5" style={{ borderTop: '1px solid rgba(236,230,218,.08)' }}>
                  <span className="relative f-display italic text-lg w-8 shrink-0" style={{ color: ok ? '#c9a6ff' : 'rgba(236,230,218,.2)' }}>{ok ? '◆' : '◇'}{ok && <Img src={ASSETS.ui.shard(k)} className="absolute -top-2 left-0 w-8 h-8 object-cover" style={{ borderRadius: 4 }} />}</span>
                  <span className="f-serif text-[14px]" style={{ color: ok ? BONE : 'rgba(236,230,218,.25)' }}>{ok ? d : `第 ${i + 1} 枚 · 尚未共鸣`}</span>
                </div>
              );
            })}
            <div className="f-mono text-[11px] mt-3" style={{ color: 'rgba(236,230,218,.45)' }}>已共鸣 {Object.keys(SHARD_META).filter((k) => shards.includes(k)).length} / {Object.keys(SHARD_META).length}</div>
          </div>
        )}

        {tab === 'log' && (
          <div className="mt-6">
            {archive.runs.length === 0 && <div className="f-serif text-[14px]" style={{ color: 'rgba(236,230,218,.4)' }}>还没有走完过一次 28 天。</div>}
            {[...archive.runs].reverse().map((r, i) => {
              const E = ENDINGS[r.end] || {};
              return (
                <div key={i} className="grid grid-cols-[auto_1fr_auto] gap-4 py-3 items-baseline" style={{ borderTop: '1px solid rgba(236,230,218,.08)' }}>
                  <span className="f-mono text-[10px]" style={{ color: 'rgba(236,230,218,.45)' }}>{fmtTime(r.at)}</span>
                  <span className="min-w-0">
                    <span className="f-serif text-[14px]" style={{ color: BONE }}>{r.loop === 2 ? '二周目' : '一周目'} · 《{E.title || r.end}》</span>
                    <span className="block f-mono text-[10px] mt-0.5" style={{ color: 'rgba(236,230,218,.45)' }}>
                      止于 Day {r.day} · Ship {r.ships} / Reset {r.resets} · ChatGPT 6 bel {r.bel ? '已发布' : '未发布'} · 心动 {r.stats.love} · 挖角 {r.stats.rival}
                    </span>
                  </span>
                  <span className="f-mono text-[11px] text-right" style={{ color: '#8fe0d2' }}>{r.known ? `与史实重合 ${r.hit}/${r.known} 天` : '—'}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {view && (
        <div onClick={() => setView(null)} className="fixed inset-0 z-[90] cursor-pointer anim-fadeIn" style={{ background: '#000' }}>
          <Img src={ASSETS.cg[view]} className="absolute inset-0 w-full h-full object-contain" />
          <div className="absolute bottom-4 inset-x-0 text-center f-serif text-[13px]" style={{ color: 'rgba(236,230,218,.7)' }}>{CG_NAME[view]} · 点击返回</div>
        </div>
      )}
    </div>
  );
}

/** 游戏中的系统菜单（Esc / 左上角 ≡） */
function GameMenu({ onClose, onSave, onLoad, onArchive, onTitle, canSave, autoQuiet, setAutoQuiet }) {
  useModalKeys(onClose);
  const [sure, setSure] = useState(false);
  const items = [['存档', canSave ? onSave : null], ['读档', onLoad], ['归档', onArchive], [sure ? '确定？未存档的进度会丢失' : '回到标题', () => (sure ? onTitle() : setSure(true))]];
  return (
    <div onClick={onClose} className="fixed inset-0 z-[84] flex items-center justify-center anim-fadeIn" style={{ background: 'rgba(5,5,8,.82)' }}>
      <div onClick={(e) => e.stopPropagation()} className="min-w-[260px]">
        <div className="f-mono text-[10px] tracking-[.5em] text-center mb-4" style={{ color: 'rgba(236,230,218,.45)' }}>— SYSTEM —</div>
        {items.map(([n, f], i) => (
          <button key={i} onClick={f || undefined} disabled={!f} className="block w-full f-serif text-xl md:text-2xl py-3 text-center transition hover:tracking-[.25em] disabled:opacity-25 disabled:hover:tracking-normal"
            style={{ color: i === 3 && sure ? RED : BONE, borderTop: '1px solid rgba(236,230,218,.12)', borderBottom: i === items.length - 1 ? '1px solid rgba(236,230,218,.12)' : 'none' }}>{n}</button>
        ))}
        <button onClick={() => setAutoQuiet(!autoQuiet)} className="block w-full mt-4 text-center f-mono text-[11px] tracking-[.2em] py-2 hover:text-white" style={{ color: autoQuiet ? '#8fe0d2' : 'rgba(236,230,218,.5)' }}>
          平淡日子自动发布 · {autoQuiet ? '开' : '关'}
          <span className="block mt-1 f-sans text-[10px] tracking-normal" style={{ color: 'rgba(236,230,218,.4)' }}>{autoQuiet ? `只在 ${KEY_MORNINGS.size} 个关键日的早上亲自选发布方案` : '28 个早上全部亲自选'}</span>
        </button>
        <button onClick={onClose} className="block mx-auto mt-4 f-mono text-[10px] tracking-[.35em] hover:text-white" style={{ color: 'rgba(236,230,218,.45)' }}>返回游戏 · ESC</button>
      </div>
    </div>
  );
}

/* ============================================================
 * 15. App
 * ============================================================ */
export default function App() {
  const [archive, setArchive] = useState(readArchive);
  const archRef = useRef(archive); archRef.current = archive;
  const [st, dispatch] = useReducer(gameReducer, undefined, () => initState(1, readArchive().seen, { shards: readArchive().shards }));
  const [feedOpen, setFeedOpen] = useState(false);
  const [seenFeed, setSeenFeed] = useState(0);
  const [auto, setAuto] = useState(false);
  const [fork, setFork] = useState({ total: 0, ifs: 0 });
  const [panel, setPanel] = useState(null); // null | 'menu' | 'save' | 'load' | 'archive'
  const [notice, setNotice] = useState('');
  const [audio, setAudioState] = useState(() => ({ vol: 0.5, muted: false, ...lsGet(LS.audio, {}) }));
  const [autoQuiet, setAutoQuietState] = useState(() => lsGet(LS.flow, { autoQuiet: true }).autoQuiet !== false);
  const setAutoQuiet = (v) => { setAutoQuietState(v); lsSet(LS.flow, { autoQuiet: v }); };
  const [unlocked, setUnlocked] = useState(false);
  const [hasSave, setHasSave] = useState(() => Object.keys(lsGet(LS.saves, {})).length > 0);

  /* ---------- 归档：任何改动立刻落盘 ---------- */
  const updArchive = (f) => setArchive((a) => { const n = f(a); lsSet(LS.archive, n); return n; });

  useEffect(() => {
    if (!st.floaters.length && !st.particles.length) return undefined;
    const ids = [...st.floaters.map((f) => f.id), ...st.particles.map((p) => p.id)];
    const t = setTimeout(() => dispatch({ type: 'CLEAN', ids }), 2400);
    return () => clearTimeout(t);
  }, [st.floaters, st.particles]);
  useEffect(() => { if (feedOpen) setSeenFeed(st.feed.length); }, [feedOpen, st.feed.length]);

  // CG 回想：真正显示过的 CG 才解锁
  const cgNow = st.phase === 'play' && !st.scene.split ? st.scene.cg : null;
  useEffect(() => {
    if (cgNow && GALLERY_CG.includes(cgNow) && !archRef.current.cg.includes(cgNow)) updArchive((a) => ({ ...a, cg: uniq([...a.cg, cgNow]) }));
  }, [cgNow]);

  // 打出结局：结局图鉴、碎片、通关日志、二周目解锁、上一周目摘要（每局只记一次）
  const endedRef = useRef(null);
  useEffect(() => {
    if (st.cur?.t !== 'ending' || !st.start) return;
    const runKey = `${st.seed}:${st.loop}:${st.ending}`;
    if (endedRef.current === runKey) return;
    endedRef.current = runKey;
    const days = (st.journal || []).filter((j) => j.match === true || j.match === false);
    const f = st.flags;
    const run = {
      at: Date.now(), loop: st.loop, end: st.ending, day: st.day, hit: days.filter((j) => j.match).length, known: days.length,
      ships: Object.keys(f).filter((k) => /^m\d+$/.test(k) && f[k] !== 'reset').length, resets: Object.keys(f).filter((k) => /^m\d+$/.test(k) && f[k] === 'reset').length,
      bel: !!f.belShipped, stats: st.stats,
    };
    const regret = st.loop === 1 && ENDINGS[st.ending]?.tone !== 'good';
    updArchive((a) => ({
      ...a, seen: uniq([...a.seen, st.ending]), shards: uniq([...a.shards, ...shardsOf(st)]), runs: [...a.runs, run].slice(-50),
      loop2: a.loop2 || st.loop === 2, prev: regret ? prevOf(st) : a.prev,
    }));
  }, [st.cur?.id]);

  // 自动存档：每天 09:00 早间审判出现时
  useEffect(() => {
    if (st.cur?.t !== 'morning' || !canSaveNow(st)) return;
    const all = { ...lsGet(LS.saves, {}), auto: makeSave(st) };
    if (lsSet(LS.saves, all)) setHasSave(true);
  }, [st.cur?.id]);

  /* ---------- 配乐 ---------- */
  useEffect(() => { fetch(`${BGM_BASE}cues.json`).then((r) => r.json()).then((j) => BGM.load(j)).catch(() => {}); }, []);
  useEffect(() => BGM.onPlay((id) => { if (!archRef.current.bgm.includes(id)) updArchive((a) => ({ ...a, bgm: uniq([...a.bgm, id]) })); }), []);
  const setAudio = (v) => { setAudioState(v); lsSet(LS.audio, v); BGM.setVolume(v.vol, v.muted); };
  useEffect(() => { BGM.setVolume(audio.vol, audio.muted); }, []);
  useEffect(() => {
    if (PROMO) return undefined;
    const h = () => { BGM.unlock(); setUnlocked(true); window.removeEventListener('pointerdown', h, true); window.removeEventListener('keydown', h, true); };
    window.addEventListener('pointerdown', h, true); window.addEventListener('keydown', h, true);
    return () => { window.removeEventListener('pointerdown', h, true); window.removeEventListener('keydown', h, true); };
  }, []);
  const desired = cueFor(st);
  useEffect(() => { if (panel !== 'archive') BGM.play(desired); }, [desired, panel]);
  useEffect(() => { if (st.rewinding) BGM.sfx('rewind'); }, [st.rewinding]);

  /* ---------- 动作：开局类动作自动带上归档里的跨周目数据 ---------- */
  const act = (a) => {
    const A = archRef.current;
    if (a.type === 'START' || a.type === 'NEW_LOOP' || a.type === 'TITLE') {
      a = { seen: A.seen, shards: A.shards, ...a };
      setFork({ total: 0, ifs: 0 }); setSeenFeed(0); setPanel(null);
    }
    if (a.type === 'NEW_LOOP') updArchive((x) => ({ ...x, loop2: true }));
    if (a.type === 'CHOOSE' && st.cur?.t === 'choice') setFork((f) => ({ total: f.total + 1, ifs: f.ifs + (a.opt.real ? 0 : 1) }));
    dispatch(a);
  };
  const loadSave = (save) => {
    if (!save) return;
    const { st: ns, ok } = replaySave(save, archRef.current.seen);
    dispatch({ type: 'LOAD', st: ns });
    setFork({ total: 0, ifs: 0 }); setSeenFeed(ns.feed.length); setPanel(null);
    setNotice(ok ? '' : '⚠ 剧本版本已更新：存档已按当前剧本重放，进度可能与存档时略有出入。');
  };
  useEffect(() => { if (!notice) return undefined; const t = setTimeout(() => setNotice(''), 6000); return () => clearTimeout(t); }, [notice]);
  const latestSave = () => { const all = lsGet(LS.saves, {}); return Object.values(all).sort((x, y) => (y.meta?.savedAt || 0) - (x.meta?.savedAt || 0))[0]; };

  // Esc：游戏中打开系统菜单
  useEffect(() => {
    const h = (e) => { if (e.key === 'Escape' && st.phase === 'play' && !panel && !feedOpen && !st.rewinding && st.cur?.t !== 'ending') { e.preventDefault(); setPanel('menu'); } };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [st.phase, panel, feedOpen, st.rewinding]);

  useEffect(() => { if (location.hash === '#start') { history.replaceState(null, '', location.pathname + location.search); act({ type: 'START', loop: 1 }); } }, []);

  // 测试钩子：仅地址带 ?debug 时暴露，供浏览器自动化验收
  useEffect(() => { if (PROMO || /[?&]debug\b/.test(location.search)) window.__g = { st, act, loadSave, cue: cueFor(st), archive, setPanel, setFeedOpen, setArchive }; });

  const divergence = (fork.total ? fork.ifs / fork.total : 0).toFixed(6);
  const unread = Math.max(0, st.feed.length - seenFeed);
  const closePanel = () => { setPanel(null); setHasSave(Object.keys(lsGet(LS.saves, {})).length > 0); };
  const panels = (
    <>
      {panel === 'menu' && <GameMenu onClose={closePanel} onSave={() => setPanel('save')} onLoad={() => setPanel('load')} onArchive={() => setPanel('archive')} onTitle={() => act({ type: 'TITLE' })} canSave={canSaveNow(st)} autoQuiet={autoQuiet} setAutoQuiet={setAutoQuiet} />}
      {(panel === 'save' || panel === 'load') && <SavePanel mode={panel} st={st} onClose={closePanel} onLoad={loadSave} />}
      {panel === 'archive' && <ArchivePanel archive={archive} onClose={closePanel} liveShards={st.phase === 'play' ? shardsOf(st) : []} />}
      {!feedOpen && !PROMO && <SoundToggle audio={audio} setAudio={setAudio} hint={!unlocked && st.phase === 'title'} />}
    </>
  );

  if (st.phase === 'title') return (
    <><style>{CSS}</style>
      <Title seen={archive.seen} hasSave={hasSave} loop2={archive.loop2 && !!archive.prev} blocked={!!panel}
        onStart={() => act({ type: 'START', loop: 1 })}
        onLoop2={() => act({ type: 'START', loop: 2, prev: archive.prev })}
        onContinue={() => loadSave(latestSave())}
        onLoad={() => setPanel('load')} onArchive={() => setPanel('archive')} />
      {panels}
    </>
  );

  return (
    <div className="h-screen w-full relative overflow-hidden f-sans" style={{ background: '#050508', color: BONE }}>
      <style>{CSS}</style>
      <Stage st={st} dispatch={act} auto={auto && !panel} setAuto={setAuto} onFeed={() => setFeedOpen(true)} unread={unread} divergence={divergence} onPanel={setPanel} paused={!!panel || feedOpen} autoQuiet={autoQuiet} />
      <Timeline open={feedOpen} onClose={() => setFeedOpen(false)} feed={st.feed} flags={st.flags} journal={st.journal} />
      {!feedOpen && <ResetCard card={st.card} onUse={() => act({ type: 'USE_CARD' })} />}
      {st.cur?.t === 'ending' && !st.rewinding && <EndingOverlay st={{ ...st, seen: uniq([...archive.seen, ...st.seen]) }} dispatch={act} />}
      {st.rewinding && <Rewind onDone={() => act({ type: 'NEW_LOOP' })} />}
      {notice && <div className="fixed top-[13%] left-1/2 -translate-x-1/2 z-[83] max-w-[90vw] px-4 py-2 f-serif text-[13px] anim-fadeUp" style={{ background: 'rgba(11,10,14,.92)', border: '1px solid rgba(226,178,79,.6)', color: '#e2b24f' }}>{notice}</div>}
      {panels}
    </div>
  );
}

import { createRoot } from 'react-dom/client';
createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
