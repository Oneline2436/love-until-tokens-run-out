<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>《相恋～直到 tokens 耗尽》主题曲 MV</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
  "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react"
} }
</script>
<style>html,body{margin:0;background:#05060d}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react">
/**
 * 《相恋直到 tokens 耗尽》主题曲 MV · v2（音频驱动 × 2.5D 虚拟摄像机 × 动态字体）
 * 非官方虚构同人作品：角色为项目原有二次元立绘，剧情虚构；不使用真人照片，不合成人声。
 *
 * 运行：node build.js → mv.html（浏览器边放歌边看，可拖进度条）
 *       mv.html?render=1 → 逐帧导出模式（.claude/render/render.py mvk：60fps、2 倍超采样）
 *
 * 时间轴不是手估的：全部来自 assets/mv/audio_features.json（.claude/audio_analysis/features.py 生成）
 *   - lines[i].tok[j]：第 i 句第 j 个字（英文按字母）的开口 / 收尾时间（Demucs 人声分轨 + Whisper 逐字 + 人声起音吸附）
 *   - kicks / onsets：鼓分轨上的底鼓与瞬态；env.kick / env.rms：60fps 包络，驱动镜头脉冲、辉光、UI 微颤
 * 镜头切点 = 对应歌词开口 − 2 帧；大字冲击 = 对应字开口 − 2 帧。
 * 所有画面都是歌曲时间 t 的纯函数：没有 CSS 动画、没有真实时钟、没有 Math.random；位移全部用浮点 transform（亚像素）。
 */
import React, { createContext, useContext, useEffect, useRef, useState } from 'react';

/* ============================================================
 * 0. 常量 / 工具
 * ============================================================ */
const A = (p) => `./assets/${p}`;
const CUT = (n) => A(`mv/cut/${n}.webp`);
const W = 1920, H = 1080;
const DUR = 208.36;
const SONG = A('bgm/src/theme_tokens.m4a');
const RENDER = new URLSearchParams(location.search).get('render') === '1';
const C = { ink: '#050508', bone: '#ece6da', cyan: '#8fe0d2', pink: '#f2a6c6', hot: '#ff5fa2', gold: '#d8b46a', red: '#ff4d3d', violet: '#c9a6ff', green: '#9be7c4', potato: '#d9b46a', dim: 'rgba(236,230,218,.55)', mag: '#ff3fb4' };
const SERIF = '"Noto Serif SC","Source Han Serif SC",SimSun,serif';
const SANS = '"Noto Sans SC","Microsoft YaHei",sans-serif';
const DISPLAY = 'Georgia,"Times New Roman",serif';
const MONO = 'Consolas,"Source Code Pro",monospace';
const LEAD = 2 / 60;                               // 视觉比声音提前 2 帧
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(x)));
const inOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const inExpo = (x) => (x <= 0 ? 0 : Math.pow(2, 10 * clamp(x) - 10));
/** 冲击曲线：前 15% 时间冲到 90%（Expo Out），后 85% 做阻尼漂移到 100% —— 动如脱兔，静如处子 */
const hitE = (x) => { x = clamp(x); return x < 0.15 ? 0.9 * outExpo(x / 0.15) : 0.9 + 0.1 * (1 - Math.pow(1 - (x - 0.15) / 0.85, 2)); };
/** 弹簧过冲：s 秒内快速冲过头再收回 */
const sprE = (s, k = 11, w = 17) => (s <= 0 ? 0 : 1 - Math.exp(-k * s) * Math.cos(w * s));
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const fmtN = (n) => Math.round(n).toLocaleString('en-US');
const GLYPHS = 'アイウエオカキクケコサシスセソタチツテト0123456789#$%&@<>/{}[]=+*ΞΣΔ';
const frameNo = (t) => Math.floor(t * 60 + 1e-6);

/* ============================================================
 * 1. 音频特征（features.py 产出）
 * ============================================================ */
let AF = null;
const env = (name, t) => {
  if (!AF) return 0; const a = AF.env[name]; const x = t * AF.fps; const i = Math.floor(x);
  if (i < 0 || i >= a.length - 1) return 0; return a[i] + (a[i + 1] - a[i]) * (x - i);
};
const kick = (t) => env('kick', t);
const rms = (t) => env('rms', t);
const toks = (s) => (s.match(/[A-Za-z]|[一-鿿]/g) || []).map((x) => x.toLowerCase());
const MISS = [];
/** 第 i 句里词 word（第 nth 次出现）的 token 位置 */
function wordPos(i, word, nth = 0) {
  const L = AF.lines[i], tk = L.tokens, w = toks(word);
  let seen = 0;
  for (let p = 0; p + w.length <= tk.length; p++) {
    if (w.every((x, q) => tk[p + q] === x)) { if (seen === nth) return [p, p + w.length - 1]; seen++; }
  }
  if (!MISS.includes(`${i}:${word}`)) MISS.push(`${i}:${word}`); return [0, tk.length - 1];
}
const WT = (i, word, nth) => AF.lines[i].tok[wordPos(i, word, nth)[0]][0] - LEAD;
const WE = (i, word, nth) => AF.lines[i].tok[wordPos(i, word, nth)[1]][1];
const LS = (i) => AF.lines[i].start - LEAD;
const LE = (i) => AF.lines[i].end;
const tokTimes = (i, from, to, a = 0) => AF.lines[i].tok.slice(wordPos(i, from)[0], to ? wordPos(i, to)[1] + 1 : undefined).map((x) => x[0] - LEAD - a);
/** 最近的强底鼓（±win 内，强度 >0.3）；没有就退回最近的节拍 */
function K(t, win = 0.22) {
  let best = null;
  for (const [kt, s] of AF.kicks) if (s > 0.3 && Math.abs(kt - t) <= win && (best == null || Math.abs(kt - t) < Math.abs(best - t))) best = kt;
  if (best == null) best = AF.beats.reduce((b, x) => (Math.abs(x - t) < Math.abs(b - t) ? x : b), AF.beats[0]);
  return best - LEAD;
}
/** 自 t 往前最近一次（强度 ≥ minS）底鼓 / 瞬态的时间与序号 */
function lastKick(t, minS = 0.3, from = 0) {
  let k = null, n = 0;
  for (const [kt, s] of AF.kicks) { if (kt - LEAD > t) break; if (s >= minS && kt >= from) { k = kt - LEAD; n++; } }
  return { at: k, n };
}
function lastOnset(t, minS = 0.15, from = 0) {
  let k = null, n = 0;
  for (const [ot, s] of AF.onsets) { if (ot - LEAD > t) break; if (s >= minS && ot >= from) { k = ot - LEAD; n++; } }
  return { at: k, n };
}
function beatsSince(t, a) { let n = 0; for (const b of AF.beats) { if (b - LEAD > t) break; if (b - LEAD >= a) n++; } return n; }
function lastBeatT(t) { let last = -9; for (const b of AF.beats) { if (b - LEAD > t) break; last = b - LEAD; } return last; }
function beatsAt(a, i) { const bs = AF.beats.filter((b) => b - LEAD >= a - 0.01); return (bs[i] ?? a + i * 0.46) - LEAD; }
/** 节拍脉冲：最近一拍后的指数衰减 */
const beatPulse = (t, d = 7) => Math.exp(-(t - lastBeatT(t)) * d);

/* ============================================================
 * 2. 虚拟摄像机 + 景深层
 * ============================================================ */
const Cam = createContext({ x: 0, y: 0, z: 1, r: 0, bump: 0, t: 0 });
/** 景深层：0.2–0.3 远景，0.5–0.6 中景大字 / UI，0.9 人物，1.5 前景氛围 */
function L({ d = 0.55, children, style }) {
  const c = useContext(Cam);
  const s = (1 + (c.z - 1) * d) * (1 + c.bump * 0.014 * d);
  return <div style={{ position: 'absolute', inset: 0, transform: `translate3d(${(c.x * d).toFixed(3)}px,${(c.y * d).toFixed(3)}px,0) rotate(${(c.r * d).toFixed(4)}deg) scale(${s.toFixed(5)})`, willChange: 'transform', ...style }}>{children}</div>;
}
const Abs = ({ children, style }) => <div style={{ position: 'absolute', ...style }}>{children}</div>;
const Full = ({ children, style }) => <div style={{ position: 'absolute', inset: 0, ...style }}>{children}</div>;
const Center = ({ children, style }) => <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', ...style }}>{children}</div>;
const Mono = ({ children, size = 18, color = C.dim, ls = '.25em', style }) => <div style={{ fontFamily: MONO, fontSize: size, color, letterSpacing: ls, whiteSpace: 'pre', ...style }}>{children}</div>;
function Img({ src, style, fit = 'cover', pos = 'center' }) {
  return <img src={src} alt="" draggable={false} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: fit, objectPosition: pos, ...style }} />;
}
/** 远景：景深 0.25，默认高斯模糊 + 暗角；底鼓时额外 1.0→1.02 脉冲 */
function Bg({ src, blur = 4, bright = 0.5, sat = 1, tint, d = 0.25, vig = 0.75 }) {
  const c = useContext(Cam);
  return (
    <L d={d}>
      <div style={{ position: 'absolute', inset: -60, transform: `scale(${(1.04 + c.bump * 0.02).toFixed(5)})`, filter: `blur(${blur}px) brightness(${bright}) saturate(${sat})` }}><Img src={src} /></div>
      {tint && <Full style={{ background: tint }} />}
      <Full style={{ background: `radial-gradient(ellipse 70% 65% at 50% 50%, transparent 35%, rgba(0,0,0,${vig}))` }} />
    </L>
  );
}
/** 赛博网格远景（给没有背景图的 UI 镜头当远景层） */
function Grid({ t, color = C.cyan, op = 0.22 }) {
  const off = (((t * 60) % 80) + 80) % 80;
  const lines = [];
  for (let i = -12; i <= 12; i++) lines.push(<line key={'v' + i} x1={960 + i * 160} y1={1080} x2={960 + i * 30} y2={560} stroke={color} strokeWidth={1.5} />);
  for (let j = 0; j < 9; j++) { const y = 560 + Math.pow((j * 80 + off) / 720, 2) * 520; lines.push(<line key={'h' + j} x1={0} y1={y} x2={W} y2={y} stroke={color} strokeWidth={1.2} />); }
  return (
    <L d={0.2}>
      <svg width={W} height={H} style={{ position: 'absolute', inset: 0, opacity: op, filter: 'blur(1.2px)' }}>{lines}</svg>
      <Full style={{ background: 'radial-gradient(ellipse 70% 65% at 50% 40%, transparent 30%, rgba(0,0,0,.8))' }} />
    </L>
  );
}
/** 主角立绘：景深 0.9；入场用 transform（不用 left/top，避免整像素吸附）；轮廓光随底鼓闪烁；环境光沿边缘融合 */
function Cut({ name, lt = 9, x = 960, h = 1000, y = 1080, from = 0, fromY = 0, delay = 0, rim, light, lightDir = 90, op = 1, clip, scale = 1, filter = '', ar = 0.75, d = 0.9, dur = 1.1 }) {
  const c = useContext(Cam);
  const k = hitE((lt - delay) / dur);
  const w = h * ar * scale, hh = h * scale;
  const glow = rim ? `drop-shadow(0 0 2px ${rim}) drop-shadow(0 0 ${(18 + c.bump * 26).toFixed(2)}px ${rim}${Math.round(clamp(0.45 + c.bump * 0.5) * 255).toString(16).padStart(2, '0')})` : '';
  return (
    <L d={d}>
      <div style={{ position: 'absolute', left: 0, top: 0, width: w, height: hh, opacity: op * clamp((lt - delay) * 6),
        transform: `translate3d(${(x - w / 2 + (1 - k) * from).toFixed(3)}px, ${(y - hh + (1 - k) * fromY).toFixed(3)}px, 0)`,
        filter: `${glow} ${filter}`, clipPath: clip, willChange: 'transform' }}>
        <Img src={CUT(name)} fit="contain" pos="bottom" />
        {light && <div style={{ position: 'absolute', inset: 0, WebkitMaskImage: `url(${CUT(name)})`, WebkitMaskSize: 'contain', WebkitMaskRepeat: 'no-repeat', WebkitMaskPosition: 'bottom center', background: `linear-gradient(${lightDir}deg, ${light} 0%, transparent 38%)`, mixBlendMode: 'screen', opacity: 0.42 + c.bump * 0.25 }} />}
      </div>
    </L>
  );
}
/** 前景氛围层：景深 1.5，失焦的雨丝 / 散景光斑 / 代码残片 / 花瓣 */
const CODE_BITS = ['tokens -= 1', 'git reset --hard', 'ship()', 'quota: 0', 'while(true) love++', '429', 'poteto.com', 'RESET?', '0x1F94', 'await you()', 'H200 · 109°C', 'ctx 500,000'];
function FG({ kind, t, color = C.pink, n }) {
  if (!kind) return null;
  const items = [];
  if (kind === 'rain') {
    for (let i = 0; i < (n || 34); i++) {
      const r1 = hash(i * 3.1), r2 = hash(i * 7.7 + 1), r3 = hash(i * 1.9 + 5);
      const y = ((r1 + t * (1.1 + r2 * 0.9)) % 1.3) - 0.15, x = (((r3 - t * 0.04) % 1) + 1) % 1;
      items.push(<line key={i} x1={x * W} y1={y * H} x2={x * W - 18} y2={y * H + 120 + r2 * 120} stroke="rgba(210,225,245,.28)" strokeWidth={3 + r2 * 5} strokeLinecap="round" />);
    }
    return <L d={1.5}><svg width={W} height={H} style={{ position: 'absolute', inset: 0, filter: 'blur(3px)' }}>{items}</svg></L>;
  }
  if (kind === 'bokeh' || kind === 'petal') {
    for (let i = 0; i < (n || 16); i++) {
      const r1 = hash(i * 2.3), r2 = hash(i * 5.1 + 2), r3 = hash(i * 8.7 + 3);
      const y = 1.15 - ((r1 + t * (0.02 + r2 * 0.03)) % 1.3), x = r3 + Math.sin(t * 0.3 + i) * 0.02;
      const rr = kind === 'petal' ? 10 + r2 * 18 : 34 + r2 * 70;
      items.push(<circle key={i} cx={x * W} cy={y * H} r={rr * (1 + kick(t) * 0.12)} fill={i % 3 === 0 ? C.gold : color} opacity={0.12 + r1 * 0.16} />);
    }
    return <L d={1.5}><svg width={W} height={H} style={{ position: 'absolute', inset: 0, filter: `blur(${kind === 'petal' ? 4 : 12}px)`, mixBlendMode: 'screen' }}>{items}</svg></L>;
  }
  if (kind === 'code') {
    return (
      <L d={1.5}>
        {CODE_BITS.slice(0, n || 9).map((s, i) => {
          const r1 = hash(i * 4.3), r2 = hash(i * 9.1 + 1), y = 1.1 - ((r1 + t * (0.025 + r2 * 0.03)) % 1.25);
          return <Abs key={i} style={{ left: 0, top: 0, transform: `translate3d(${(hash(i * 6.7) * 1700).toFixed(1)}px,${(y * H).toFixed(2)}px,0)`, fontFamily: MONO, fontSize: 30 + r2 * 40, color: i % 2 ? C.cyan : color, opacity: 0.18 + r2 * 0.16, filter: `blur(${(2.5 + r2 * 3).toFixed(1)}px)`, whiteSpace: 'nowrap' }}>{s}</Abs>;
        })}
      </L>
    );
  }
  return null;
}

/* ============================================================
 * 3. 文字组件
 * ============================================================ */
/** 逐字动效。lt = 文字自己的时钟；times = 每个字自己的开口时间（与 lt 同一时钟）。mode: rise / slam / drop / spread / scatter / blur */
function Chars({ text, lt, mode = 'rise', size = 120, color = C.bone, font = SERIF, weight = 900, ls = 0.06, stagger = 0.045, dur = 1.0, align = 'center', italic, outline, shadow, lh = 1.1, seed = 1, times }) {
  const chars = [...text];
  let ci = -1;
  return (
    <div style={{ fontFamily: font, fontWeight: weight, fontSize: size, lineHeight: lh, letterSpacing: `${ls}em`, textAlign: align, fontStyle: italic ? 'italic' : 'normal', whiteSpace: 'pre', color: outline ? 'transparent' : color, WebkitTextStroke: outline ? `${outline}px ${color}` : undefined, textShadow: shadow }}>
      {chars.map((ch, i) => {
        if (ch === '\n') return <br key={i} />;
        if (ch.trim()) ci++;
        const s = times ? lt - (times[Math.min(Math.max(ci, 0), times.length - 1)] ?? 0) : lt - i * stagger;
        const e = hitE(s / dur), sp = sprE(s);
        const r = hash(i * 13 + seed);
        let tf = '';
        const o = clamp(s * 14);
        if (mode === 'rise') tf = `translate3d(0,${((1 - e) * 70).toFixed(2)}%,0)`;
        else if (mode === 'drop') tf = `translate3d(0,${((1 - clamp(sp, 0, 1.2)) * -160).toFixed(2)}%,0) rotate(${((1 - clamp(sp)) * (r - 0.5) * 40).toFixed(2)}deg)`;
        else if (mode === 'slam') tf = `scale(${lerp(2.6, 1, clamp(sp, 0, 1.15)).toFixed(4)})`;
        else if (mode === 'spread') tf = `translate3d(${((1 - e) * (i - chars.length / 2) * 70).toFixed(2)}px,0,0)`;
        else if (mode === 'scatter') tf = `translate3d(${((1 - e) * (r - 0.5) * 900).toFixed(2)}px,${((1 - e) * (hash(i + seed * 7) - 0.5) * 600).toFixed(2)}px,0) rotate(${((1 - e) * (r - 0.5) * 180).toFixed(2)}deg)`;
        else if (mode === 'blur') tf = `scale(${lerp(1.35, 1, e).toFixed(4)})`;
        return <span key={i} style={{ display: 'inline-block', transform: tf, opacity: o, filter: mode === 'blur' ? `blur(${((1 - e) * 18).toFixed(2)}px)` : undefined }}>{ch === ' ' ? ' ' : ch}</span>;
      })}
    </div>
  );
}
/** 赛博解码：从左到右逐字锁定；未锁定的字每帧刷新乱码；锁定瞬间青 / 品红双色差闪光（times = 每个字的锁定时刻，绝对时间） */
function Decode({ text, t, at, size = 80, color = C.bone, font = MONO, weight = 700, ls = 0.12, step = 0.06, scramble = 0.35, times, italic }) {
  const f = frameNo(t);
  let ci = -1;
  return (
    <div style={{ fontFamily: font, fontWeight: weight, fontSize: size, letterSpacing: `${ls}em`, whiteSpace: 'pre', fontStyle: italic ? 'italic' : 'normal', lineHeight: 1.1 }}>
      {[...text].map((ch, i) => {
        if (ch === ' ') return <span key={i}> </span>;
        ci++;
        const lock = times ? times[Math.min(ci, times.length - 1)] : at + scramble + ci * step;
        const appear = Math.min(at + ci * step * 0.5, lock - 0.05);
        if (t < appear) return <span key={i} style={{ opacity: 0 }}>{ch}</span>;
        if (t < lock) {
          const g = GLYPHS[Math.floor(hash(f * 31 + i * 7.3) * GLYPHS.length)];
          return <span key={i} style={{ display: 'inline-block', color: 'rgba(143,224,210,.75)', opacity: 0.55 + 0.45 * hash(f + i), fontWeight: 400, width: '0.9em', textAlign: 'center' }}>{g}</span>;
        }
        const k = Math.exp(-(t - lock) / 0.09);
        return <span key={i} style={{ display: 'inline-block', color, transform: `scale(${(1 + k * 0.18).toFixed(4)})`, textShadow: k > 0.02 ? `${(-7 * k).toFixed(2)}px 0 rgba(0,240,255,${(0.9 * k).toFixed(3)}), ${(7 * k).toFixed(2)}px 0 rgba(255,40,190,${(0.9 * k).toFixed(3)})` : 'none', filter: k > 0.02 ? `brightness(${(1 + k * 0.8).toFixed(3)})` : undefined }}>{ch}</span>;
      })}
    </div>
  );
}
/** 笔画描边：SVG 文字描边画出，再填色 */
function Stroke({ text, lt, size = 300, color = C.pink, w = 1600, h = 400, dur = 1.0, fillAt = 0.8, font = SERIF, weight = 900, sw = 3 }) {
  const k = hitE(lt / dur), f = prog(lt, fillAt, fillAt + 0.35);
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ overflow: 'visible' }}>
      <text x="50%" y="50%" dominantBaseline="central" textAnchor="middle" fontFamily={font} fontWeight={weight} fontSize={size} fill={color} fillOpacity={f} stroke={color} strokeWidth={sw} strokeDasharray="2600" strokeDashoffset={2600 * (1 - k)} style={{ paintOrder: 'stroke' }}>{text}</text>
    </svg>
  );
}
/** 故障切片：按帧号确定性地切 3 条水平带并错位，带色散 */
function Glitch({ children, t, amt = 1, seed = 3 }) {
  const f = frameNo(t);
  if (amt < 0.03) return <div style={{ position: 'relative' }}>{children}</div>;
  const sl = (j) => { const y0 = hash(f * 3 + j + seed) * 92; return `inset(${y0.toFixed(2)}% 0 ${Math.max(0, 100 - y0 - 4 - hash(f + j) * 16).toFixed(2)}% 0)`; };
  const dx = (j) => ((hash(f * 5 + j + seed) - 0.5) * 90 * amt).toFixed(2);
  return (
    <div style={{ position: 'relative' }}>
      <div>{children}</div>
      {[0, 1, 2].map((j) => (
        <div key={j} style={{ position: 'absolute', inset: 0, clipPath: sl(j), transform: `translate3d(${dx(j)}px,0,0)`, filter: j === 0 ? 'drop-shadow(-8px 0 rgba(0,240,255,.9))' : j === 1 ? 'drop-shadow(8px 0 rgba(255,40,190,.9))' : 'none' }}>{children}</div>
      ))}
    </div>
  );
}
function PathText({ text, t, d, size = 64, color = C.bone, speed = 300, font = DISPLAY, italic = true, opacity = 1, id = 'p' }) {
  return (
    <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ position: 'absolute', inset: 0, opacity }}>
      <defs><path id={id} d={d} /></defs>

const CHANT = ['耗', '耗', '耗尽', 'TOKENS'];
const FONTS3 = [SERIF, SANS, MONO];
let STROBE = null;
function strobeTimes(a, b) {   // 频闪只取强底鼓，两次间隔 ≥ 0.36 s（≤ 2.8 次/秒，低于 3 Hz 光敏安全线）
  if (STROBE && STROBE.a === a) return STROBE.v;
  const v = []; for (const [kt, s] of AF.kicks) if (kt - LEAD >= a && kt - LEAD <= b && s >= 0.55 && (!v.length || kt - LEAD - v[v.length - 1] >= 0.36)) v.push(kt - LEAD);
  STROBE = { a, v }; return v;
}
S.chant = ({ t, lt, a, len }) => {
  const on = lastOnset(t, 0.15, a + LEAD - 0.001);          // 每个鼓点瞬态
  const kk = lastKick(t, 0.35, a + LEAD - 0.001);           // 每个底鼓
  const ko = on.at == null ? 0 : Math.exp(-(t - on.at) / 0.07);
  const kq = kk.at == null ? 0 : Math.exp(-(t - kk.at) / 0.1);
  const word = CHANT[kk.n % 4];
  const heavy = on.n % 2 === 0;
  const pos = [[0, 0], [-420, -180], [400, 160], [-360, 200], [380, -200], [0, 120]][kk.n % 6];
  let sk = 0; for (const s of strobeTimes(a, a + len)) if (t >= s && t < s + 0.12) sk = Math.max(sk, Math.exp(-(t - s) / 0.04));
  const hot = on.n % 8;
  const zoom = lerp(1, 1.35, inOut(prog(lt, len - 2.5, len)));
  return (
    <Full style={{ background: C.ink, overflow: 'hidden' }}>
      <L d={0.25}>

          {TILES.map((s, i) => <div key={i} style={{ position: 'relative', overflow: 'hidden', filter: i === hot ? `brightness(${(0.9 + ko * 0.5).toFixed(3)})` : 'brightness(.22) saturate(.5)' }}><Img src={A(s)} /></div>)}

      <L d={0.8}>
        <Center style={{ transform: `translate3d(${pos[0]}px,${pos[1]}px,0) scale(${lerp(1, 1.5, kq).toFixed(4)})` }}>
          <Glitch t={t} amt={ko * 1.1} seed={on.n}>
            <div style={{ fontFamily: word === 'TOKENS' ? DISPLAY : FONTS3[on.n % 3], fontStyle: word === 'TOKENS' ? 'italic' : 'normal', fontWeight: heavy ? 900 : 200, fontSize: word === 'TOKENS' ? 260 : word === '耗尽' ? 360 : 300, color: word === '耗尽' ? C.hot : C.bone, letterSpacing: word === 'TOKENS' ? '.08em' : 0, textShadow: `${(-10 * ko).toFixed(1)}px 0 rgba(0,240,255,.85), ${(10 * ko).toFixed(1)}px 0 rgba(255,40,190,.85), 0 0 40px rgba(0,0,0,.9)` }}>{word}</div>
          </Glitch>
        </Center>
      </L>
      {/* 横向切片：每个瞬态把画面切成错位条带 */}
      {ko > 0.15 && [0, 1, 2, 3].map((j) => <Abs key={j} style={{ left: 0, right: 0, top: hash(on.n * 9 + j) * 1000, height: 8 + hash(on.n + j) * 40, background: j % 2 ? 'rgba(0,240,255,.18)' : 'rgba(255,40,190,.18)', transform: `translate3d(${((hash(on.n * 3 + j) - 0.5) * 300 * ko).toFixed(1)}px,0,0)`, mixBlendMode: 'screen' }} />)}
      {sk > 0.01 && <Full style={{ background: `rgba(255,95,162,${(0.32 * sk).toFixed(3)})`, mixBlendMode: 'screen' }} />}
      <FG kind="code" t={t} n={10} />
    </Full>
  );
};
